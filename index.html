<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Pickle Map</title>
<link rel="preload" href="assets/fonts/fredoka.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/fonts/nunito.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{font-family:"Fredoka";src:url("assets/fonts/fredoka.ttf") format("truetype");font-weight:300 700;font-style:normal;font-display:swap}
  @font-face{font-family:"Nunito";src:url("assets/fonts/nunito.ttf") format("truetype");font-weight:200 1000;font-style:normal;font-display:swap}
  :root{
    --paper:#fdf1ec;
    --ink:#4a3f3d;
    --ink-soft:#6f625f;
    --muted:#786762;
    --orange:#e8845c;
    --orange-deep:#ac492d;
    --pin:#f2b53c;
    --pin-deep:#e0a02a;
    --pin-ink:#6b4a1a;
    --rule:rgba(74,63,61,.12);
    --card:#fffaf6;
    --sea-lo:#f9e7df;
    --sea-mid:#f6ded5;
    --sea-hi:#f0d3c8;
    --cn-fill:#F5DFB3;
    --cn-edge:#E0B77E;
    --land-a:#a9d4bf;
    --land-b:#d2c1e6;
    --sans:"Nunito","PingFang SC",system-ui,sans-serif;
    --round:"Fredoka","Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;
    background-image:
      radial-gradient(58% 54% at 50% 46%,rgba(255,252,250,.92),rgba(255,252,250,0) 72%),
      radial-gradient(42% 40% at 88% 8%,rgba(210,193,230,.26),rgba(210,193,230,0) 70%),
      radial-gradient(46% 46% at 6% 90%,rgba(169,212,191,.30),rgba(169,212,191,0) 70%),
      radial-gradient(38% 34% at 18% 12%,rgba(246,222,213,.55),rgba(246,222,213,0) 70%);
  }
  .stage{position:relative;height:100%;height:100dvh;width:100%;overflow:hidden}

  header{position:absolute;left:clamp(20px,4vw,54px);top:clamp(20px,4vh,46px);z-index:4;pointer-events:none}
  .kicker{margin:0 0 8px;font-family:var(--round);font-size:11px;letter-spacing:.18em;color:var(--muted)}
  h1{margin:0;font-size:clamp(26px,3.4vw,42px);line-height:1.15;font-weight:600;letter-spacing:.02em}
  h1 .en{display:block;margin-top:6px;font-size:clamp(11px,1vw,13px);letter-spacing:.06em;color:var(--muted);font-weight:400}

  header{max-width:calc(100vw - 2 * clamp(20px,4vw,54px))}
  header h1{max-width:100%}
  @media(min-width:760px){body.detail-open header{max-width:calc(100vw - var(--detail-width) - clamp(20px,4vw,54px) - 40px)}}
  .site-intro{max-width:min(440px,100%);margin:10px 0 0;color:var(--ink-soft);font-size:13px;line-height:1.65;text-wrap:pretty}
  @media(max-width:759px){.site-intro{font-size:12px;max-width:min(360px,100%)}body.detail-open .site-intro{display:none}}

  /* 小卡预览，原地展开；一次只阅读一种风味 */
  .peek{position:absolute;z-index:7;width:min(300px,calc(100vw - 24px));max-height:min(380px,50dvh,var(--peek-limit,50dvh));
    display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:16px;background:var(--card);
    box-shadow:0 16px 48px -12px rgba(92,65,60,.25);opacity:0;visibility:hidden;pointer-events:none;
    transform:translateY(4px);transition:none}
  .peek.show{opacity:1;visibility:visible;transform:none;pointer-events:auto}
  .peek.expanded{max-height:min(50dvh,var(--peek-limit,50dvh))}
  .peek-head{flex:none;padding:14px 16px 10px;border-bottom:1px solid var(--rule);position:relative}
  .peek-title{margin:0;font-size:19px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}

  .peek-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px;scrollbar-width:thin;scrollbar-color:#cbb6b0 transparent}
  .peek-grid{min-width:0}
  .food-entry{min-width:0;overflow-wrap:anywhere}
  .peek .photo-figure{margin:0;min-width:0}
  .peek .food-photo,.peek .noimg{display:block;width:100%;height:140px;aspect-ratio:auto;object-fit:cover;border-radius:9px;background:#f7ece7}
  .peek .photo-caption{font-size:10px;line-height:1.5;margin:6px 0 0;color:var(--muted)}
  .food-place{margin:0 0 5px;font-size:11px;color:var(--muted);line-height:1.6}
  .food-entry h3{margin:0;font-size:18px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
  .food-local{margin:6px 0 0;color:var(--ink-soft);font-size:12px;line-height:1.5}
  .food-facts{margin:18px 0 0;display:grid;gap:10px}
  .food-fact{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;font-size:13px;line-height:1.8}
  .food-fact dt{color:var(--muted)}.food-fact dd{margin:0;color:var(--ink)}
  .food-sources{margin:16px 0 0;padding-top:10px;border-top:1px solid var(--rule);font-size:10px;line-height:1.7;color:var(--muted)}
  .food-sources p{margin:3px 0}.food-sources a{color:inherit;text-decoration:underline;text-underline-offset:3px}

  .peek-map-link{margin-top:10px}
  .peek-empty{padding:12px 0;color:var(--ink-soft);font-size:14px;line-height:1.8}
  .peek-empty button{display:block;margin-top:12px}
  .peek .image-fallback{min-height:96px;padding:8px;font-size:11px}
  .peek:not(.expanded) .photo-caption{display:none}
  .food-summary{font-size:13px;line-height:1.7;color:var(--ink-soft);margin:12px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .peek-expand{margin-top:12px;padding:7px 0;border:0;background:none;color:var(--orange-deep);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

  .china-intro{margin:0 0 10px;font-size:13px;line-height:1.8;color:var(--ink-soft)}
  @media(max-width:680px){

    .peek-expand{min-height:40px}
  }

  /* 中国版图：从地球里点进来 */
  .cnview{position:absolute;inset:0;z-index:4;opacity:0;pointer-events:none;
    transform:scale(1.035);transform-origin:50% 46%;
    transition:opacity .42s ease, transform .62s cubic-bezier(.22,.61,.36,1)}
  .cnview.show{opacity:1;transform:none;pointer-events:auto}
  body.china-mode header,
  body.china-mode .globe-wrap,
  body.china-mode .spark{opacity:0;pointer-events:none;transition:opacity .28s ease}
  #cnCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:default}
  .cnpins{position:absolute;inset:0;pointer-events:none}
  .cn-top{position:absolute;left:clamp(20px,4vw,54px);top:clamp(20px,4vh,46px);pointer-events:none}
  .cn-kicker{margin:0 0 8px;font-family:var(--round);font-size:11px;letter-spacing:.18em;color:var(--muted)}
  .cn-top h2{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:600;letter-spacing:.02em}
  .cn-actions{position:absolute;right:clamp(18px,3.6vw,56px);top:clamp(20px,4vh,46px);display:flex;gap:8px}
  .cn-btn{padding:8px 15px 9px;border-radius:999px;border:0;
    background:rgba(255,250,246,.9);color:var(--ink-soft);font-family:inherit;font-size:12.5px;
    letter-spacing:.04em;cursor:pointer;transition:color .2s ease,border-color .2s ease,background .2s ease}
  .cn-btn:hover{color:var(--ink)}
  .cn-btn span{font-size:13px;line-height:1;opacity:.7}

  .cpin{position:absolute;left:0;top:0;display:flex;align-items:center;pointer-events:auto;
    cursor:pointer;opacity:0;animation:pinIn .5s ease forwards}
  @keyframes pinIn{from{opacity:0;transform:translate(-50%,-40%) scale(.7)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .cpin .cdot{position:relative;width:6px;height:6px;border-radius:50%;background:var(--pin);
    border:0;box-shadow:0 1px 4px rgba(126,92,94,.32);
    transition:transform .16s ease,background .16s ease}
  .cpin.cluster .cdot{width:20px;height:20px;display:grid;place-items:center;font-size:9.5px;
    color:var(--pin-ink);font-weight:600}
  .cpin .ctag{position:absolute;left:14px;top:50%;transform:translateY(-50%) translateX(-4px);
    padding:4px 9px 5px;border-radius:999px;background:#fffaf6;border:1px solid var(--rule);
    box-shadow:0 6px 14px -10px rgba(126,92,94,.55);font-size:12px;color:var(--ink);
    white-space:nowrap;opacity:0;transition:opacity .16s ease,transform .16s ease;pointer-events:none}
  .cpin.cluster .ctag{left:24px}
  .cpin:hover .ctag{opacity:1;transform:translateY(-50%) translateX(0)}
  .cpin.flip .ctag{left:auto;right:14px;transform:translateY(-50%) translateX(4px)}
  .cpin.flip.cluster .ctag{right:24px}
  .cpin.flip:hover .ctag{transform:translateY(-50%) translateX(0)}

  .globe-wrap{position:absolute;inset:0;z-index:1}
  #globe{position:absolute;left:0;top:0;max-width:none;max-height:none}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .spark{position:absolute;color:rgba(226,180,172,.85);pointer-events:none;font-size:14px;line-height:1}
  .spark.s1{left:16%;top:26%;font-size:12px;opacity:.75}
  .spark.s2{left:78%;top:20%;font-size:16px;opacity:.6}
  .spark.s3{left:88%;top:62%;font-size:11px;opacity:.7}
  .spark.s4{left:26%;top:74%;font-size:13px;opacity:.55}

  /* 地图上的点 */
  .marker{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;
    z-index:3;cursor:pointer;transition:opacity .18s linear}
  .marker .dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--pin);
    border:0;box-shadow:0 1px 3px rgba(126,92,94,.26);
    transition:transform .16s ease,background .16s ease;display:grid;place-items:center;
    font-size:8.5px;color:var(--pin-ink);line-height:1}
  .marker.big .dot{width:10px;height:10px;font-size:0;font-weight:600}
  .marker .tag{position:absolute;left:16px;top:50%;transform:translateY(-50%) translateX(-4px);
    padding:4px 9px 5px;border-radius:999px;background:#fffaf6;border:1px solid var(--rule);
    box-shadow:0 6px 14px -10px rgba(126,92,94,.55);
    font-size:12px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .16s ease,transform .16s ease;pointer-events:none}
  .marker.big .tag{left:24px}
  .marker:hover .tag{opacity:1;transform:translateY(-50%) translateX(0)}
  .marker.active .tag{opacity:1;transform:translateY(-50%) translateX(0);border-color:rgba(224,160,42,.55)}
  .marker.active .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1.5px solid rgba(224,160,42,.55);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .marker.flip .tag{left:auto;right:16px;transform:translateY(-50%) translateX(4px)}
  .marker.flip .tag{right:24px}
  .marker.flip:hover .tag,.marker.flip.active .tag{transform:translateY(-50%) translateX(0)}
  .marker.china .dot{box-shadow:0 1px 3px rgba(126,92,94,.22)}
  .marker.china .dot::before{content:"";position:absolute;inset:-13px;border-radius:50%;
    border:1px solid rgba(220,170,87,.5);animation:pulse 3.4s ease-out infinite}

  @media (max-width:820px){
    header{top:16px;left:18px}

    .cn-actions{right:auto;left:14px;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
    .cn-top{top:calc(env(safe-area-inset-top,0px) + 16px);left:18px}
    .cn-top h2{font-size:21px}
    .cpin .ctag{font-size:11.5px}
    .spark{display:none}

  }
  @media (prefers-reduced-motion:reduce){

    .marker.active .dot::after{animation:none;opacity:.5}
  }

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  ::selection{background:#ebcba8;color:var(--ink)}
  button,input{font-family:inherit}button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #9a652b;outline-offset:4px}
  [hidden]{display:none!important}

    .marker,.cpin{appearance:none;padding:0;border:0;background:none;color:inherit;font:inherit;justify-content:center;min-width:32px;min-height:32px;touch-action:manipulation}
  .marker .tag,.cpin .ctag{left:calc(50% + 12px)}
  .marker.big .tag,.cpin.cluster .ctag{left:calc(50% + 16px)}
  .marker.flip .tag,.cpin.flip .ctag{left:auto;right:calc(50% + 12px)}
  .marker.flip.big .tag,.cpin.flip.cluster .ctag{right:calc(50% + 16px)}
  .marker:focus-visible .tag,.cpin:focus-visible .ctag{opacity:1;transform:translateY(-50%)}
  .marker .dot,.cpin .cdot{flex-shrink:0}

  .photo-figure{margin:0}.fit-contain{object-fit:contain!important;background:#fffdf9}.photo-caption{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 0}
  .image-failed img{display:none!important}.image-fallback{display:none;min-height:110px;place-items:center;padding:16px;background:#f7ece7;color:var(--muted);font-size:12px;border-radius:9px;text-align:center;line-height:1.8}
  .image-failed .image-fallback{display:grid}.image-fallback a{text-decoration:underline}

  .category-label{display:inline-block;background:#f2e2cf;color:#745331;font-size:11px;border-radius:5px;padding:3px 7px;margin-top:9px}
  @media(max-width:820px){.marker,.cpin{min-width:44px;min-height:44px}.cn-actions .cn-btn{min-height:44px}.cn-top h2{font-size:20px}}
  @media(prefers-reduced-motion:reduce){.cpin,.marker.active .dot::after,.marker.china .dot::before{animation:none;opacity:1}.cnview,.peek,.marker,.cpin{transition:none}}

  .peek .food-place{margin:10px 0 0}.peek.expanded .food-photo{height:160px}
  .cn-return{position:absolute;left:clamp(18px,4vw,54px);top:24px;z-index:6}
  .cn-top{top:86px}.cn-top .cn-kicker{display:none}.cn-top h2{font-size:21px}
  .cn-actions{left:auto;bottom:auto;right:24px;top:24px;z-index:6}
  .cn-directory{position:absolute;right:18px;top:80px;bottom:22px;width:170px;z-index:5;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#cbb6b0 transparent;}
  .cn-directory button{display:block;width:100%;text-align:left;padding:5px 8px;border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:12px;line-height:1.6;cursor:pointer}
  .cn-directory button:hover,.cn-directory button.active{color:var(--orange-deep);text-decoration:underline;text-underline-offset:4px}
  .marker,.cpin{min-width:26px;min-height:26px}.cpin{animation:none;opacity:1}
  @media(max-width:820px){.cn-directory{right:8px;width:120px}.cn-directory button{padding:5px 6px;font-size:11px}.cn-return{left:18px;top:18px}.cn-actions{right:18px;top:18px}.cn-top{top:80px}.cn-top h2{font-size:18px}}
  @media(max-width:600px){
    .cn-directory{left:12px;right:12px;top:auto;bottom:12px;width:auto;height:min(180px,30dvh);background:var(--paper);border-top:1px solid var(--rule);padding-top:6px}
    .cn-directory button{min-height:36px;font-size:12px;padding:7px 10px}
    body.china-mode.directory-open .peek{width:min(300px,calc(100vw - 24px))}
  }
  :root{--detail-width:clamp(320px,38vw,440px)}
  .detail-pane{position:absolute;z-index:9;right:0;top:0;bottom:0;width:var(--detail-width);background:transparent;border:0;display:flex;flex-direction:column;padding:28px 28px 40px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none}
  .detail-pane::-webkit-scrollbar{display:none;width:0;height:0}
  @media(min-width:760px){.detail-pane{top:var(--detail-top,0px);bottom:auto;height:var(--detail-height,100%);padding-block:0}}
  .detail-content{width:100%;max-width:360px;flex-shrink:0;margin:auto;text-align:center}
  .detail-content .food-facts{text-align:left}
  .detail-pane h2{font-size:26px;line-height:1.35;margin:0 0 8px;overflow-wrap:anywhere}
  .detail-pane .detail-place{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 18px}
  .detail-pane .food-photo{display:block;width:100%;height:210px;object-fit:cover;border-radius:10px;background:#f7ece7}
  .detail-pane .food-facts{margin-top:22px;gap:16px}.detail-pane .food-fact{font-size:14px}
  body.detail-open .cn-directory,body.detail-open .cn-actions{visibility:hidden}
  @media(max-width:759px){
    .detail-pane{top:auto;left:0;width:100%;height:58dvh;border:0;padding:20px 22px 32px}
    .detail-pane h2{font-size:22px}.detail-pane .food-photo{height:180px}
    body.detail-open header .kicker,body.detail-open header .en,body.detail-open .cn-top{display:none}
    body.detail-open header h1{font-size:22px}
  }
  .marker.active .dot::after,.marker.china .dot::before{content:none}
  .marker .dot,.marker.china .dot,.cpin .cdot{box-shadow:0 0 5px rgba(255,195,106,.65),0 0 10px rgba(255,195,106,.28)}
  /* All map markers use the same star in default and interactive states. */
  .marker.world .dot,.marker.china .dot,.cpin .cdot,
  .marker:hover .dot,.marker.active .dot,.marker:focus-visible .dot,
  .cpin:hover .cdot,.cpin.active .cdot,.cpin:focus-visible .cdot{
    width:12px;height:12px;border-radius:0;background:var(--pin);transform:none;box-shadow:none;
    clip-path:polygon(50% 0%,64% 36%,100% 50%,64% 64%,50% 100%,36% 64%,0% 50%,36% 36%);
  }
  .marker[aria-pressed="true"] .dot,.cpin[aria-pressed="true"] .cdot{background:#E99BAF}
  .cpin:hover .cdot,.cpin.active .cdot,.cpin:focus-visible .cdot{background:#E99BAF}
  .peek-connector{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible}
  .peek-connector path{fill:none;stroke:#CB93A3;stroke-width:1;stroke-dasharray:3 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .nearby-flavors{margin:12px 0;text-align:left}
  .nearby-flavors p{font-size:11px;color:var(--muted);margin:0 0 4px}
  .nearby-flavors button{display:block;max-width:100%;min-height:30px;padding:5px 0;border:0;background:none;color:var(--orange-deep);font:inherit;font-size:12px;line-height:1.4;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .peek-footer{flex:none;padding:10px 16px 12px;border-top:1px solid var(--rule);background:var(--card)}
  .peek-more{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:30px;padding:0;border:0;background:none;color:var(--orange-deep);font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}
  .peek-more:hover span{text-decoration:underline;text-underline-offset:3px}
  /* Soft English lettering, with compact, readable long food names. */
  h1,.cn-top h2,.peek-title,.detail-pane h2{font-family:var(--round);font-weight:500;letter-spacing:0;text-wrap:balance}
  h1{font-size:clamp(28px,3.5vw,44px);max-width:100%}
  .peek-title{font-size:20px;line-height:1.25}
  .cn-directory button{overflow-wrap:anywhere;hyphens:auto;line-height:1.45;padding-top:7px;padding-bottom:7px}
  .peek .food-fact{grid-template-columns:minmax(0,1fr);gap:2px}
  .food-fact dt{font-weight:700}
  /* Labels size to their text, independently of the tiny absolute-positioned pin. */
  .marker .tag,.cpin .ctag{display:block;width:max-content;max-width:var(--label-width,min(210px,55vw));white-space:normal;overflow-wrap:break-word;word-break:normal;hyphens:none;text-align:left;line-height:1.4;border-radius:10px}
  .cn-top{left:0;right:0;top:24px;height:44px;display:grid;place-items:center;text-align:center;padding-inline:110px}
  .cn-top h2{font-size:32px;line-height:1.15}
  .cn-return,.cn-actions .cn-btn{height:44px;display:flex;align-items:center;justify-content:center;padding-block:0}
  @media(max-width:820px){.cn-top{top:18px;padding-inline:100px}.cn-top h2{font-size:clamp(18px,3.2vw,26px)}}
  .marker.world .tag,.cpin .ctag{display:none}
  .marker.china .tag::after{content:attr(data-hint);display:none;margin-top:4px;font-size:11px;line-height:1.45;color:var(--ink-soft)}
  .marker.china:hover .tag::after,.marker.china:focus-visible .tag::after{display:block}
  /* Chromium/WebKit: 3 px instead of the previous thin (~6 px) scrollbar. */
  @supports selector(::-webkit-scrollbar){
    .cn-directory{scrollbar-width:auto}
    .cn-directory::-webkit-scrollbar{width:3px;height:3px}
    .cn-directory::-webkit-scrollbar-track{background:transparent}
    .cn-directory::-webkit-scrollbar-thumb{background:#cbb6b0;border-radius:3px}
    .cn-directory::-webkit-scrollbar-thumb:hover{background:#ac928a}
  }
  /* Touch layouts retain the map above a separately scrollable reading area. */
  @media(max-width:820px){

<script>
const DATA = {"china":[{"id":"cn-xiangyang-datoucai","name":"Xiangyang preserved mustard root (datoucai)","place":"Xiangyang, Hubei","materials":"Root mustard, salt, and seasonings that vary by product.","process":"Repeated salting, brining, sun-drying and sealed maturation are traditionally summarized as “three saltings, five brinings and six dryings.” Fermentation, salt penetration and dehydration together create its flavor and texture.","taste":"Salty and savory with a little sweetness; its matured flavor differs from the sharp pungency of fresh mustard root. Seasoned versions vary.","eat":"Shredded and dressed as a small side dish; Stir-fried with shredded pork; Braised or steamed with pork belly.","photo":"assets/photos/cn-xiangyang-datoucai-correct.jpg","credit":"Hubei Chucai Research Institute, Hubei University of Economics · Copyright retained by the source; no open license stated · https://ccyjy.hbue.edu.cn/b1/36/c8562a241974/page.htm","sourceUrl":"https://manu61.magtech.com.cn/zgnz/fileup/0254-5071/HTML/中国酿造201907020.html","sourceTitle":"Changes in physicochemical characteristics during production of traditionally fermented Xiangyang datoucai","photoKind":"Prepared food","photoCaption":"Xiangyang preserved mustard root. The low-resolution source photo is shown uncropped.","categoryLabel":"Regional pickle","photoFit":"contain","photoSource":"https://ccyjy.hbue.edu.cn/b1/36/c8562a241974/page.htm","catalogName":"Xiangyang preserved mustard root","lat":32.04,"lon":112.14},{"id":"cn-northeast-sour-napa","name":"Northeastern Sour Napa Cabbage (Dongbei Suancai)","place":"Liaoning, Jilin and Heilongjiang, with related sour-cabbage traditions in northern Hebei and elsewhere in northern China.","materials":"Napa cabbage, often long-headed local varieties; water and salt form the traditional fermentation medium. Household methods vary.","process":"Whole cabbages or large pieces are packed into a crock, weighted and kept submerged to ferment. Some traditions use raw cabbage; others blanch it first. Fermentation creates the sourness, but there is no single recipe shared by every household.","taste":"Clean cabbage sourness, salt and vegetable flavor; the traditional basic version does not depend on a chili paste.","eat":"Pork belly poached or stewed with sour cabbage; Sour cabbage, pork and blood sausage, often called shazhu cai; Sour cabbage with glass noodles or frozen tofu; Sour-cabbage hotpot; Pork-and-sour-cabbage dumplings or steamed buns.","photo":"assets/photos/dongbei-suancai-stew.jpg","credit":"Techyan · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Suan_cai,_pork,_and_Chinese_blood_sausage_stew.jpg","sourceUrl":"https://www.dc.gov.cn/cydc/pin/201805/t20180529_218976.html","sourceTitle":"Exploring Dongchang: Sour Cabbage with Pork and Blood Sausage","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Northeastern Sour Napa Cabbage","lat":45.0,"lon":124.6},{"id":"cn-hetao-sour-cabbage","name":"Hetao Sour Cabbage","place":"Bayannur and the Hetao region of Inner Mongolia.","materials":"Cabbage varieties described locally as qingmaye, pingtoubai and juanxinbai.","process":"Local descriptions layer cabbage and salt in a crock and add weights. Liquid released by the vegetables creates the fermentation environment, unlike some cabbage traditions that begin with added brine. This is a description of the tradition rather than a household recipe.","taste":"Sour, salty and cabbage-rich. In the finished stew, its acidity joins the richness of pork and fat.","eat":"Pork-and-sour-cabbage stew; Sour cabbage stewed with potatoes; Hetao mixed stew with tofu and glass noodles; Pork-and-sour-cabbage stew served with drained broomcorn-millet rice.","photo":"assets/photos/meal-suancai-pork-noodles.jpg","credit":"Cecikierk · Public domain, released by the author (PD-self) · https://commons.wikimedia.org/wiki/File:Suan_cai_pork_stew.jpg","sourceUrl":"https://www.wltqq.gov.cn/zjqq/aswltqq/mswltqq/202609/t20260929_605383.html","sourceTitle":"Food in Urad Front Banner: Pork and Sour-Cabbage Stew","licenseUrl":"https://commons.wikimedia.org/wiki/Template:PD-self","photoKind":"Serving example","photoCaption":"Serving example: sour cabbage stewed with pork and glass noodles, not photographed in Hetao.","categoryLabel":"Regional pickle","catalogName":"Hetao Sour Cabbage","lat":40.75,"lon":107.39},{"id":"cn-korean-chinese-napa-kimchi","name":"Korean-Chinese Spicy Napa Cabbage","place":"Yanbian in Jilin, and Korean communities in Liaoning, Heilongjiang and other parts of northeastern China.","materials":"Napa cabbage with chili, garlic, ginger and other seasonings; some local and household recipes include fish-based sauces.","process":"Cabbage is first salted, then coated between the leaves with a prepared seasoning mixture and stored to ferment. The defining sequence joins salting, seasoning paste and further fermentation, rather than simply submerging cabbage in plain brine.","taste":"A combination of chili heat, salt, sourness and often sweetness and savory depth. Acidity changes with ripeness and recipe.","eat":"A small side dish with a meal; Soups and fried rice made with the fermented cabbage; specific recipes vary locally.","photo":"assets/photos/ingredient-napa-cabbage.jpg","credit":"Sous Chef / Sous Chef Photos · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Napa_cabbage.jpg","sourceUrl":"https://www.ihchina.cn/project_details/14752/","sourceTitle":"Kimchi-Making Skills of the Korean Ethnic Community in China","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: napa cabbage, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Korean-Chinese Spicy Napa Cabbage","lat":42.89,"lon":129.51},{"id":"cn-korean-chinese-radish-kimchi","name":"Korean-Chinese Cubed Radish Pickles","place":"Rongxing in Panjin, Liaoning, and Korean communities across northeastern China.","materials":"Radish cut into pieces; seasonings vary by place and household, with red-chili versions common.","process":"Radish replaces cabbage as the main vegetable and is salted, seasoned and fermented. Cutting style and seasoning should be described for the particular local version.","taste":"Typical red-chili versions are salty, sour and hot while retaining radish flavor. Not every version has the same level of heat.","eat":"A small side dish with rice and everyday meals.","photo":"assets/photos/ingredient-daikon-radish.jpg","credit":"Eric Polk (Epolk) · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Daikon_radish_-_Minowase.jpg","sourceUrl":"https://www.panjin.gov.cn/html/2009/2020-06-11/content-121833.html","sourceTitle":"Panjin Government: Rongxing Korean-Community Kimchi-Making Skills","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: white radish, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Korean-Chinese Cubed Radish Pickles","lat":40.95,"lon":122.05},{"id":"cn-tianshui-jiangshuicai","name":"Tianshui Jiangshui Greens","place":"Tianshui and Qin'an in Gansu, with related jiangshui traditions in Longnan.","materials":"Seasonal bitter greens, celery, cabbage, shepherd's purse or radish tops, together with flour-based cooking liquid and an established fermentation starter.","process":"Vegetables are cleaned, cut and blanched, then fermented with a flour-based liquid and starter. The starchy liquid and the continued use of previous jiangshui distinguish this family from ordinary seasoned-brine pickles.","taste":"Refreshing acidity, from gently sour to distinctly tart. Noodle dishes may add chili oil, chives and other seasonings.","eat":"Jiangshui noodles; Jiangshui yuyu dumplings; Jiaotuan and sanfan served with jiangshui, with regional differences; Jiangshui soup accompanying noodles.","photo":"assets/photos/cn-tianshui-jiangshuicai.jpg","credit":"Qingning Jia from Lanzhou, China · CC BY-SA 2.0 · https://commons.wikimedia.org/wiki/File:%E6%B5%86%E6%B0%B4%E9%9D%A2_(175157609).jpg","sourceUrl":"https://www.tianshui.gov.cn/wlj/info/2462/155422.htm","sourceTitle":"Tianshui Culture and Tourism Bureau: A Taste of Tianshui","photoKind":"Prepared food","photoCaption":"Serving example: jiangshui noodles, not photographed in Tianshui.","categoryLabel":"Regional pickle","catalogName":"Tianshui Jiangshui Greens","lat":34.86,"lon":105.67},{"id":"cn-hanzhong-jiangshuicai","name":"Hanzhong Jiangshui Greens","place":"Hanzhong, Liuba, Zhenba and nearby areas of Shaanxi.","materials":"Leafy mustard, locally called hualacai, and other greens; cabbage or celery may also be used. The medium includes established jiangshui or flour-based liquid.","process":"Washed, blanched leaves undergo lactic fermentation in jiangshui or flour-based liquid. A Hanzhong local standard describes the greens as a semi-finished sour vegetable, often subsequently stir-fried, seasoned with hot oil or added to a staple dish.","taste":"Sour and vegetal; jiangshui noodles commonly add chili oil and garlic shoots for an aromatic sour-hot dish.","eat":"Hanzhong jiangshui noodles; Jiangshui jiaotuan and yuyu; Potato ciba served with jiangshui greens soup; Caitofu or vegetable-tofu porridge set with sour jiangshui.","photo":"assets/photos/cn-hanzhong-jiangshuicai.jpg","credit":"Suoluoguo Tianjian Jishi · Copyright retained by the source; no open license stated · https://suoluoguo.com/%E6%B5%86%E6%B0%B4%E8%8F%9C","sourceUrl":"https://amr.hanzhong.gov.cn/hzsjgj/gsgg/202401/f82107e44b0747db9bb2bf0cff0aa461/files/%E6%B1%89%E4%B8%AD%E7%89%B9%E8%89%B2%E5%B0%8F%E5%90%83%E5%88%B6%E4%BD%9C%E5%B7%A5%E8%89%BA%E8%A7%84%E7%A8%8B%20%E7%95%A5%E9%98%B3%E8%8F%9C%E8%B1%86%E8%85%90%E8%8A%82%E8%8A%82.pdf.pdf","sourceTitle":"DB6107/T 47-2023: Preparation of Lueyang Cai Doufu Jiejie, a Hanzhong Local Snack","photoKind":"Prepared food","photoCaption":"Hanzhong jiangshui greens, as identified in the source article.","categoryLabel":"Regional pickle","photoSource":"https://suoluoguo.com/%E6%B5%86%E6%B0%B4%E8%8F%9C","catalogName":"Hanzhong Jiangshui Greens","lat":33.07,"lon":107.03},{"id":"cn-ziyang-liaosuancai","name":"Ziyang Liao Sour Greens","place":"Ziyang County in Ankang, Shaanxi, including Huangu and Shuang'an.","materials":"Locally named wild youcai greens. Standard-development materials identify the raw material as leafy mustard; the local name should not be assigned to a different botanical species without confirmation.","process":"Local greens are sorted, washed, pickled and naturally fermented. Household methods and modern standardized products should be described separately; promotional accounts do not establish a universal salt level or fermentation time.","taste":"Bright sourness and vegetable flavor, often with a golden-yellow appearance; acidity and saltiness differ between products.","eat":"Liao sour-greens noodle soup; Sour greens stir-fried with pork; Steamed buns or dumplings with sour-greens filling; Sour-greens soup; Contemporary liao-suancai banquet menus.","photo":"assets/photos/cn-ziyang-liaosuancai.jpg","credit":"Ziyang County Government · Copyright retained by the source; no open license stated · https://www.zyx.gov.cn/Content-2562596.html","sourceUrl":"https://www.zyx.gov.cn/Content-2823125.html","sourceTitle":"The Flavour of a Jar of Liaosuancai: Ziyang's Local Speciality Reaches a Wider Audience","photoKind":"Prepared food","photoCaption":"Ziyang fermented greens, from the Ziyang County Government’s article on liao suancai.","categoryLabel":"Regional pickle","photoSource":"https://www.zyx.gov.cn/Content-2562596.html","catalogName":"Ziyang Liao Sour Greens","lat":32.52,"lon":108.54},{"id":"cn-sc-paocai","name":"Sichuan and Chongqing brine pickles (paocai)","place":"Sichuan and Chongqing; widely made both at home and commercially","materials":"Vegetables such as radish, cabbage, yardlong beans, cucumber and mustard greens; brine, with ginger, chilies, Sichuan pepper and other seasonings varying by household.","process":"Vegetables are submerged in seasoned brine and undergo lactic acid fermentation in a closed vessel. Some households maintain and reuse an established brine. This is a continuing practice, not one fixed recipe shared by every jar.","taste":"A sour and salty base, with heat, numbing spice and sweetness depending on the seasonings.","eat":"A small side dish with a meal; Paocai dressed with chili oil; A seasoning ingredient for stir-fries and stews.","photo":"assets/photos/sichuan-paocai.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Sichuan_pickles_in_Beijing_(20161122163831).jpg","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7590268/","sourceTitle":"Sichuan paocai fermented by mixed-starter culture of lactic acid bacteria","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Sichuan and Chongqing brine pickles","lat":30.6,"lon":104.4},{"id":"cn-cy-qingcai","name":"Sichuan and Chongqing sour mustard greens (pao suan qingcai)","place":"Sichuan and Chongqing","materials":"Leaf mustard, locally often called da qingcai; salt or brine, with seasonings varying by method.","process":"Mustard greens may be pre-salted before a further fermentation, or fermented directly in a jar. The finished greens are often sliced or shredded for cooking.","taste":"Sour, salty and savory. Heat often comes from fermented chilies added during cooking; the greens themselves are not always spicy.","eat":"Suancai fish soup (suancai yu); Sour-greens hotpot; Sour-greens and glass-noodle soup.","photo":"assets/photos/meal-pickled-mustard-fish.jpg","credit":"alchen_x · CC BY-SA 2.0 · https://commons.wikimedia.org/wiki/File:Pickled_mustard_fish_filet_soup.jpg","sourceUrl":"https://manu61.magtech.com.cn/zgnz/article/2024/0254-5071/2024-10-178.html","sourceTitle":"Quality and flavor differences in suancai fermented from different mustard varieties","licenseUrl":"https://creativecommons.org/licenses/by-sa/2.0/","photoKind":"Serving example","photoCaption":"Serving example: fish with sour mustard greens.","categoryLabel":"Regional pickle","catalogName":"Sichuan and Chongqing sour mustard greens","lat":30.2,"lon":105.6},{"id":"cn-sc-xizao","name":"Quick-dipped Sichuan pickles (xizao paocai)","place":"Sichuan and Chongqing","materials":"Tender, crisp vegetables such as radish peel, stem-lettuce strips and cabbage; an existing paocai brine.","process":"Vegetables spend a short time in pickle brine and are eaten soon, emphasizing freshness and crunch. They contrast with vegetables left deeper in the jar for longer maturation.","taste":"Light, refreshing sour-salty flavors rather than intensely developed acidity.","eat":"Mixed quick-dipped pickles; A small pickle dish dressed with chili oil.","photo":"assets/photos/tiaoshui-quick-paocai.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Tiaoshui_Paocai_at_a_restaurant_in_Jiang%27an,_Yibin_(20250117112257).jpg","sourceUrl":"https://cpgi.org.cn/?a=detail&c=i&cataid=15&id=3115","sourceTitle":"Geographical Indications website: Sichuan paocai","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Quick-dipped Sichuan pickles","lat":29.9,"lon":103.8},{"id":"cn-cy-cowpea","name":"Fermented yardlong beans (pao jiangdou)","place":"Especially Sichuan and Chongqing; other provinces have their own sour-bean methods","materials":"Yardlong beans and brine; fermented chilies may be added when cooking.","process":"Yardlong beans ferment in brine in a jar. Once ready, they are often chopped into small pieces to supply acidity and crunch in a stir-fry.","taste":"Sour and salty; cooking with chilies adds a sour-hot, savory character.","eat":"Chopped fermented beans stir-fried with minced pork; Fermented beans stir-fried with fermented chilies.","photo":"assets/photos/sour-cowpea.jpg","credit":"Fumikas Sagisavas · CC0 · https://commons.wikimedia.org/wiki/File:Spicy_and_sour_cowpea.jpg","sourceUrl":"https://www.yankitchen.com/blog/stir-fried-sichuan-style-pickled-string-beans-and-ground-pork","sourceTitle":"Yankitchen: Stir-fried Sichuan pickled beans and ground pork","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Fermented yardlong beans","lat":29.6,"lon":106.3},{"id":"cn-cy-spice-pickles","name":"Fermented ginger and chilies (pao jiang and pao jiao)","place":"Sichuan and Chongqing","materials":"Young ginger or chilies, made separately or within a shared brine tradition; brine and optional spices.","process":"Young ginger and chilies are preserved through brine fermentation, then shredded, chopped or used whole. They can be side dishes, but are particularly important as sources of acidity, heat and aroma in cooking.","taste":"Ginger combines acidity with gingery heat; chilies combine acidity and salt, with heat varying by pepper variety.","eat":"Used with sour mustard greens in suancai fish; Fermented-chili fish dishes.","photo":"assets/photos/preserve-paocai-jar-platter.jpg","credit":"Zhimin He / AngyHe · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Sichuan_Pao_Cai_and_Pao_Cai_Jar.jpg","sourceUrl":"https://www.jiangjin.gov.cn/jrjj/fycp/202208/t20220809_10988856.html","sourceTitle":"Jiangjin District Government: Suancai fish as a local heritage food","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Fermented ginger and chilies","lat":30.8,"lon":105.1},{"id":"cn-cq-zhacai","name":"Fuling pressed mustard stem (zhacai)","place":"Fuling, Chongqing","materials":"The swollen stem of stem mustard, known as qingcaitou; salt and seasonings.","process":"Traditional production air-dries the stems, then uses repeated salting, pressing and trimming before further fermentation with seasonings. Modern processing methods and scales vary.","taste":"Primarily salty and savory. Seasoned versions may be hot or spiced; strong sourness is not usually the defining taste.","eat":"Shredded zhacai as a small side dish; Stir-fried zhacai and shredded pork (serving idea).","photo":"assets/photos/zhacai-bowl.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Zhacai_in_a_bowl_(20210622125217).jpg","sourceUrl":"https://www.ihchina.cn/project_details/14641/","sourceTitle":"China Intangible Cultural Heritage: Traditional Fuling zhacai production","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Fuling pressed mustard stem","lat":29.7,"lon":107.39},{"id":"cn-sc-yacai","name":"Yibin preserved mustard strips (yacai)","place":"Yibin, Sichuan","materials":"Leaf-mustard petioles or tender stems; salt, sugar, Sichuan pepper and other spices.","process":"Mustard is cut into strips and partly dried, salted, then matured with sugar and spices. Suimi yacai is a common finely chopped form of the matured vegetable.","taste":"Salty and savory with sweetness and spice.","eat":"Yibin burning noodles (ranmian); Yacai steamed pork belly (xian shaobai), a banquet pairing.","photo":"assets/photos/yacai-ranmian-serving.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Ranmian_at_Beijing_Yibin_Hostel_(20210401111937).jpg","sourceUrl":"https://patents.google.com/patent/CN106616676A/zh","sourceTitle":"A method for producing finely chopped yacai — patent text","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Serving example: burning noodles, rather than preserved yacai on its own.","categoryLabel":"Regional pickle","catalogName":"Yibin preserved mustard strips","lat":28.77,"lon":104.63},{"id":"cn-sc-nanchong-dongcai","name":"Nanchong aged mustard greens (dongcai)","place":"Nanchong, Sichuan, including traditions around Qingju in Gaoping","materials":"Jiangan mustard greens; salt, Sichuan pepper and other aromatic spices.","process":"The mustard is wilted, rubbed with salt, dehydrated and pickled. The prepared greens are mixed with spices and packed in jars for repeated tending and sealed maturation.","taste":"Deeply salty and savory, with pronounced spices rather than bright sourness.","eat":"A vegetable seasoning in Sichuan cooking; Chopped into steamed pork or noodle dishes (serving idea).","photo":"assets/photos/ingredient-leaf-mustard.jpg","credit":"thebittenword.com · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Mustardgreensraw.jpg","sourceUrl":"https://lzhbwg.mofcom.gov.cn/edi_ecms_web_front/thb/detail/c633dffca9d9493faccf8994a6b31706","sourceTitle":"Ministry of Commerce Time-honored Brands Digital Museum: Yanshan","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: mustard greens, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Nanchong aged mustard greens","lat":30.84,"lon":106.11},{"id":"cn-yn-midu","name":"Midu sour chopped mustard greens (suan yancai)","place":"Midu, Dali Prefecture, Yunnan","materials":"Local da qingcai mustard greens; salt, chilies and sugar, with ginger, garlic and fennel varying by household.","process":"Mustard greens are wilted, washed and chopped, mixed with salt and seasonings, then pressed into a sealed earthenware jar to ferment. This account describes one household example; water content, seasoning and season create different local forms.","taste":"Sour and salty, often hot with a little sweetness.","eat":"A topping or ingredient for noodles, rice noodles and ersi rice-cake strips; Sour-pickle soup; A seasoning for quick stir-fries.","photo":"assets/photos/meal-suancai-bone-broth-mixian.jpg","credit":"Liuxingy · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:%E9%85%B8%E8%8F%9C%E9%AA%A8%E6%B1%A4%E7%B1%B3%E7%BA%BF%EF%BC%88%E6%9C%AA%E6%B7%B7%E5%90%88%EF%BC%89.jpg","sourceUrl":"https://nync.yn.gov.cn/html/2024/zhoushilianbo-new_0228/404438.html","sourceTitle":"Yunnan Department of Agriculture and Rural Affairs: Midu mustard greens and regional branding","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example: rice noodles in bone broth with sour greens, not photographed in Midu.","categoryLabel":"Regional pickle","catalogName":"Midu sour chopped mustard greens","lat":25.34,"lon":100.49},{"id":"cn-yn-fuyuan","name":"Fuyuan sour greens (suancai)","place":"Fuyuan, Qujing, Yunnan","materials":"Leafy greens, sometimes with white radish; water, with salt and other ingredients depending on household or commercial methods.","process":"Local greens ferment into sour vegetables. Fuyuan has a tradition emphasizing the vegetables’ own flavor and few seasonings. Commercial lines may include washing, fermentation and desalting, so the whole tradition should not be described as salt-free.","taste":"Distinctive acidity with the vegetables’ own flavor.","eat":"Fuyuan sour greens with pork trotters; Sour greens simmered with ham, chicken or fish.","photo":"assets/photos/meal-fuyuan-sour-trotters.jpg","credit":"Ruilijiang de Heshui · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:%E5%AF%8C%E6%BA%90%E9%85%B8%E6%B1%A4%E7%8C%AA%E8%84%9A_-_2024-05-22.jpg","sourceUrl":"https://ynscsp.cn/nd.jsp?fromColId=2&id=7110","sourceTitle":"Yunnan Provincial Library rural culture service: Fuyuan suancai","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example: pork trotters in Fuyuan sour soup.","categoryLabel":"Regional pickle","catalogName":"Fuyuan sour greens","lat":25.67,"lon":104.25},{"id":"cn-yn-gan-yancai","name":"Yunnan fermented dried greens (gan yancai)","place":"Baoshan, Qujing, Lincang, Dehong and other parts of Yunnan","materials":"Leaf vegetables that vary by place; some local methods use rice slurry or spices.","process":"Vegetables are washed, wilted, optionally blanched, drained and fermented in a sealed vessel before drying. Salt is usually absent or used sparingly, but regional methods differ.","taste":"Pronounced sourness after rehydration; saltiness is usually not the most prominent taste.","eat":"Sour soup prepared by steeping or simmering; Soups with other vegetables or meat.","photo":"assets/photos/cn-yn-gan-yancai.jpg","credit":"Janinga Chang · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Dried_pickled_mustard_greens_served_as_seasoning_at_a_restaurant_in_Mangshi.jpg","sourceUrl":"https://ynswsjkw.yn.gov.cn/html/2024/shipinganquandfbz_1127/4022000.html","sourceTitle":"Yunnan Health Commission: Explanatory notes for the dried fermented greens standard","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Yunnan fermented dried greens","lat":25.1,"lon":99.6},{"id":"cn-yn-dai-suansun","name":"Yunnan Dai-style fermented bamboo shoots (suansun)","place":"Dai communities in Yunnan, including Dehong and Xishuangbanna","materials":"Fresh bamboo shoots and water; household methods vary.","process":"Shredded or otherwise cut shoots are treated with water, pressed into a vessel and sealed for natural souring. Research on traditional suansun includes salt-free methods.","taste":"Clearly sour, becoming sour-hot when paired with chilies.","eat":"Simmered with chicken, fish or pork ribs; Stir-fried with beef, snail meat or water spinach.","photo":"assets/photos/ingredient-bamboo-shoots.jpg","credit":"Fumikas Sagisavas · CC0 1.0 · https://commons.wikimedia.org/wiki/File:Bamboo_shoots.jpg","sourceUrl":"https://www.neac.gov.cn/seac/ztzl/daiz/fsxg.shtml","sourceTitle":"National Ethnic Affairs Commission: Dai customs","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: fresh bamboo shoots, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Yunnan Dai-style fermented bamboo shoots","lat":22.6,"lon":100.6},{"id":"cn-gz-dushan","name":"Dushan sweet-sour mustard greens (yan suancai)","place":"Dushan, Qiannan, Guizhou","materials":"Broad-leafed, crisp-stemmed mustard greens; chili powder, fermented glutinous rice, salt and rock sugar.","process":"Mustard greens are first wilted, salted and fermented. After trimming and pressing, they are combined with fermented glutinous rice and seasonings, then packed into jars for further fermentation. The rice component creates a flavor distinct from simple brined greens.","taste":"Distinctively sweet and sour, with saltiness and heat.","eat":"A small accompaniment to rice; Chopped into minced-meat or tofu dishes (serving idea).","photo":"assets/photos/ingredient-leaf-mustard.jpg","credit":"thebittenword.com · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Mustardgreensraw.jpg","sourceUrl":"https://cpgi.org.cn/?a=detail&c=i&cataid=3&id=1010","sourceTitle":"AQSIQ Announcement 167 of 2013: Dushan yan suancai quality requirements","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: mustard greens, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Dushan sweet-sour mustard greens","lat":25.83,"lon":107.55},{"id":"cn-wuling-zha-guangjiao","name":"Fermented chili and grain meal (zha guangjiao)","place":"The Wuling Mountains, including Enshi in Hubei, Qianjiang and Youyang in Chongqing, and parts of western Hunan","materials":"Fresh red chilies, cornmeal or rice flour, salt, and optional ginger, garlic and spices.","process":"Chopped chilies are mixed with grain meal, salt and seasonings, packed in a jar and sealed for natural fermentation. Some communities use inverted water-sealed jars. The mixture is generally steamed or stir-fried before eating.","taste":"Sour-hot flavors together with grain notes.","eat":"Stir-fried with cured pork; Stir-fried with twice-cooked pork; Used beneath steamed meat or pork ribs.","photo":"assets/photos/ingredient-red-chilies.jpg","credit":"Nicholas Gemini (Nicholas Frisardi) · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Red_Chili_peppers.JPG","sourceUrl":"https://nyncw.cq.gov.cn/zwxx_161/qxlb/202201/t20220117_10306699.html","sourceTitle":"Chongqing Agriculture and Rural Affairs Commission: Tujia inverted jars in Qianjiang","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: fresh chilies, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Fermented chili and grain meal","lat":29.3,"lon":109.3},{"id":"cn-hn-duolajiao","name":"Hunan chopped salted chilies (duo lajiao)","place":"Hunan","materials":"Fresh red chilies and salt, with ginger, garlic or baijiu varying by recipe.","process":"Chilies are chopped, mixed with salt and other ingredients, and packed into jars. Traditional aged versions mature through fermentation and are used in cooking or as accompaniments.","taste":"Hot, fresh-tasting and salty-savory; fermented versions can also be sour.","eat":"Fish head steamed with chopped chilies; Seasoning for steamed dishes and other main courses.","photo":"assets/photos/ingredient-red-chilies.jpg","credit":"Nicholas Gemini (Nicholas Frisardi) · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Red_Chili_peppers.JPG","sourceUrl":"https://hunan.gov.cn/hnszf/jxxx/hxwh/cwd/201711/t20171111_4685420.html","sourceTitle":"Hunan Provincial Government: Duo jiao","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: fresh chilies, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Hunan chopped salted chilies","lat":27.9,"lon":112.3},{"id":"cn-gz-zaolajiao","name":"Guizhou fermented chopped chilies (zao lajiao)","place":"Guizhou, including Zunyi and Guiyang","materials":"Fresh red chilies and salt, with optional sugar, baijiu, ginger and garlic.","process":"Chilies are washed, drained, chopped and combined with other ingredients before sealed fermentation. Commercial products may be packaged and heat-treated afterward.","taste":"Fresh-tasting, sour, hot and salty, often with ginger and garlic.","eat":"Guizhou zao la fish; Seasoning for stir-fried and braised dishes.","photo":"assets/photos/ingredient-red-chilies.jpg","credit":"Nicholas Gemini (Nicholas Frisardi) · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Red_Chili_peppers.JPG","sourceUrl":"https://www.ttbz.org.cn/Home/PdfFileStreamGet/c3QsMTA3NDEz","sourceTitle":"T/QLY 190-2023: Guizhou zao lajiao","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: fresh chilies, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Guizhou fermented chopped chilies","lat":27.2,"lon":106.8},{"id":"cn-sc-zizhong-dongjian","name":"Zizhong matured mustard tips (dongjian)","place":"Zizhong County, Neijiang, Sichuan","materials":"Tender tips of local mustard varieties such as Pipaye and Qitouhuang; salt.","process":"The mustard tips are air-dried, salted and naturally fermented to maturity. The cited Fengyuan tradition emphasizes making them without added spices, allowing the greens and maturation to shape the flavor.","taste":"Salty-savory and rounded, emphasizing aroma rather than strong acidity.","eat":"A small seasoned accompaniment; Chopped into steamed meat or noodle dishes (serving idea).","photo":"assets/photos/ingredient-leaf-mustard.jpg","credit":"thebittenword.com · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Mustardgreensraw.jpg","sourceUrl":"https://lzhbwg.mofcom.gov.cn/edi_ecms_web_front/thb/detail/c58cf16bbecb458f812f5dad955f0d08","sourceTitle":"Ministry of Commerce Time-honored Brands Digital Museum: Fengyuan","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: mustard greens, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Zizhong matured mustard tips","lat":29.76,"lon":104.85},{"id":"cn-shaoxing-meigancai","name":"Shaoxing Dried Mustard Greens (Meigancai)","place":"Shaoxing in Zhejiang, within the wider dried-greens traditions of Jiangsu and Zhejiang.","materials":"Mustard greens such as xuelihong and broad-leaf mustard; salt. The bamboo-shoot variant also includes spring bamboo shoots.","process":"Traditional methods salt and ferment the vegetables before drying them; some add further steaming and sun-drying. Household and producer methods differ. Modern Shaoxing standards also specify mustard-family vegetables and drying, but do not imply identical steaming cycles for every product.","taste":"Salty, savory and mellow, with concentrated mature vegetable flavor. Sourness is generally less prominent than in wet sour greens.","eat":"Pork braised or steamed with meigancai; Meigancai with paofan, rice in water or broth; Shaoxing dried bamboo shoots and greens.","photo":"assets/photos/meigancai-bundle.jpg","credit":"Sjschen · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:MeiganCaiBundle.jpg","sourceUrl":"https://zjnews.zjol.com.cn/zjnews/202411/t20241105_30623498.shtml","sourceTitle":"Shaoxing Meigancai Receives a Common Standard — Zhejiang Daily","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Shaoxing Dried Mustard Greens","lat":30.03,"lon":120.58},{"id":"cn-ningbo-xianji","name":"Ningbo Salt-Fermented Mustard Greens (Xianji)","place":"Ningbo in Zhejiang, including Qiu'ai, Yinzhou and Yuyao.","materials":"Xuelihong, a mustard-green variety, and salt.","process":"The greens are spread out to wilt, layered with salt in a crock, packed tightly and weighted. Vegetable juices form the pickling medium before sealed maturation. Harvest season and storage duration affect color and acidity.","taste":"Savory and salty with fermented sourness and a sweet finish; particularly compatible with seafood.","eat":"Yellow-croaker soup with xianji; Xianji stir-fried with shredded pork; Xianji with bamboo-shoot strips or edamame; Rice-cake soup with xianji.","photo":"assets/photos/meal-xuecai-pork-stirfry.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Xuecai_Rousi_on_K1035_(20260315124754).jpg","sourceUrl":"https://www.nbdag.org.cn/art/2025/2/27/art_1229826643_26179.html","sourceTitle":"A Little Vegetable and Its Own Museum: Ningbo's Attachment to Xianji — Ningbo Archives, by the Xuecai Museum","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example; the photo does not establish the pickle’s origin or preparation method.","categoryLabel":"Regional pickle","catalogName":"Ningbo Salt-Fermented Mustard Greens","lat":29.88,"lon":121.55},{"id":"cn-shaoxing-ningbo-fermented-amaranth-stalk","name":"Fermented Amaranth Stalks (Mei Xiancai Geng)","place":"Shaoxing and Ningbo in Zhejiang.","materials":"Thick, mature stalks of the locally used amaranth-type plant; salt. Some methods use an established fermentation brine.","process":"The stalks are cut, soaked, salted and matured in a jar. Local versions differ in whether the material is pre-cooked and whether old brine is used. The finished stalks are usually steamed before eating.","taste":"Salty, savory and intensely fermented, contrasting with plain rice.","eat":"Steamed fermented stalks finished with sesame oil; Steamed or cooked with tofu, pumpkin, taro or small fish.","photo":"assets/photos/cn-shaoxing-ningbo-fermented-amaranth-stalk.jpg","credit":"源義信 · CC BY 4.0 · https://commons.wikimedia.org/wiki/File:2025-01-30_Stinky_Chinese_spinach_with_Tofu,_Anchi,_Chekiang.jpg","sourceUrl":"https://www.ezhejiang.gov.cn/2021-07/01/c_638401.htm","sourceTitle":"Moldy Amaranth Stalks — Official Zhejiang English Website","photoKind":"Prepared food","photoCaption":"Serving example: fermented amaranth with tofu.","categoryLabel":"Regional pickle","catalogName":"Fermented Amaranth Stalks","lat":29.98,"lon":121.05},{"id":"cn-ningbo-stinky-winter-melon","name":"Ningbo Pungent Fermented Winter Melon","place":"Ningbo and the Ningbo-Shaoxing plain in Zhejiang.","materials":"Winter melon, salt and an established pungent fermentation brine in the traditional version.","process":"Cut winter melon is salted and, in traditional versions, matured in an established pungent brine. Both raw-pickled and pre-cooked routes exist. Mild, briefly salted refrigerated melon should not be equated with long-matured brine versions.","taste":"Salty and savory, sometimes mildly sour. The naturally mild melon takes on the flavor of its brine.","eat":"A small portion dressed with sesame oil and served with rice; Steamed according to the local preparation or product instructions.","photo":"assets/photos/ingredient-winter-melon.jpg","credit":"WingkLEE · Public domain — author release (PD-self) · https://commons.wikimedia.org/wiki/File:Winter_melon.jpg","sourceUrl":"https://news.cnnb.com.cn/system/2025/06/29/030679860.shtml","sourceTitle":"Ningbo's Flavourful Summer Rice Companions — China Ningbo Net","licenseUrl":"https://commons.wikimedia.org/wiki/File:Winter_melon.jpg#Licensing","photoKind":"Ingredient example","photoCaption":"Ingredient example: winter melon, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Ningbo Pungent Fermented Winter Melon","lat":29.72,"lon":121.75},{"id":"cn-ningbo-fermented-taro-stalk","name":"Ningbo Pungent Fermented Taro Stalks","place":"Ningbo, Zhejiang.","materials":"The above-ground leaf stalks of the locally used taro, rather than its underground corm; salt and established pungent brine.","process":"One of Ningbo's three pungent vegetable specialties. Taro stalks are prepared, salted and matured in pungent brine. Household pre-cooking and brine methods differ.","taste":"Salty and savory, with a pronounced fermented character.","eat":"A small rice accompaniment; any further steaming or cooking should follow reliable local or product guidance.","photo":"assets/photos/ingredient-taro-leaf-stalks.jpg","credit":"Chiring chandan · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Stems_of_taro_leaves_ready_for_sale.jpg","sourceUrl":"https://news.cnnb.com.cn/system/2016/09/07/008546603.shtml","sourceTitle":"Late Summer and Early Autumn: Time to Make Ningbo's Three Pungent Preserves — Southeast Business Daily Field Report","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: taro stalks, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Ningbo Pungent Fermented Taro Stalks","lat":30.08,"lon":121.32},{"id":"cn-xiaoshan-luobogan","name":"Xiaoshan Dried Radish (Luobogan)","place":"Xiaoshan in Hangzhou, Zhejiang, including Guali.","materials":"Radish, traditionally the suitable yidaozhong variety, and salt.","process":"Skin-on strips alternate between drying, salting and pressing in crocks before sealed maturation. The traditional description is three dryings and three saltings. Craft interviews describe this alternating process as staged maturation or fermentation.","taste":"Salty and savory with natural sweetness; modern versions may add chili seasoning.","eat":"Dried radish scrambled with eggs; Dried radish stir-fried with edamame; Dried radish with cured pork; Sweet-and-sour seasoned dried radish.","photo":"assets/photos/ingredient-daikon-radish.jpg","credit":"Eric Polk (Epolk) · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Daikon_radish_-_Minowase.jpg","sourceUrl":"https://hznews.hangzhou.com.cn/xinzheng/quxian/content/2020-06/02/content_7746866.htm","sourceTitle":"Guali's Intangible-Heritage Speciality: Xiaoshan Dried Radish Receives National Recognition — Xiaoshan Daily","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: white radish, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Xiaoshan Dried Radish","lat":30.18,"lon":120.26},{"id":"cn-yuyao-zhacai","name":"Yuyao Preserved Mustard Stem (Zhacai)","place":"Yuyao on the southern shore of Hangzhou Bay, especially its northwestern coastal plain in Zhejiang.","materials":"The swollen, knobbly stem of stem mustard, plus salt; finished products may receive further seasoning.","process":"Trimmed mustard stems are salted to remove water, re-salted and matured, then sold whole, sliced or shredded. This belongs to the same broad zhacai family as Fuling, with its own growing area, suitable varieties and Zhejiang processing tradition.","taste":"Salty and savory, often emphasizing freshness, tenderness and crunch. Seasoned versions vary widely and are not uniformly mild.","eat":"Shreds stir-fried with pork; An ingredient in noodle soup; A little beside congee; these are general zhacai serving suggestions rather than rituals unique to Yuyao.","photo":"assets/photos/zhacai-bowl.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Zhacai_in_a_bowl_(20210622125217).jpg","sourceUrl":"https://www.cnipa.gov.cn/attach/0/20250826010509.pdf","sourceTitle":"Yuyao Zhacai Geographical-Indication Protection Requirements — CNIPA Announcement Appendix","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Yuyao Preserved Mustard Stem","lat":30.04,"lon":121.15},{"id":"cn-tianjin-dongcai","name":"Tianjin Garlic-Scented Preserved Cabbage (Dongcai)","place":"Jinghai District in Tianjin, including Chenguantun.","materials":"Napa-cabbage leaves, salt and garlic; local and commercial recipes may use other seasonings.","process":"Cabbage is selected, cut and dried to remove moisture, then mixed with salt and garlic and packed into jars to ferment and mature. It is a finely chopped, garlic-scented seasoning vegetable, distinct from Sichuan's Nanchong dongcai.","taste":"Intensely salty-savory with clear garlic flavor; a small amount adds depth to soup.","eat":"Wonton soup with dongcai; Noodle soup finished with dongcai; A small addition to stews or home-style stir-fries.","photo":"assets/photos/tianjin-dongcai.jpg","credit":"Glane23 · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:D%C5%8Dngc%C3%A0i.jpg","sourceUrl":"https://www.tjl.tj.cn/ArticleContent.aspx?ChannelId=241&ID=29008","sourceTitle":"Tasting the Twenty-Four Solar Terms: Xiaohan and Tianjin Dongcai — Tianjin Library","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Tianjin Garlic-Scented Preserved Cabbage","lat":38.94,"lon":116.97},{"id":"cn-zhejiang-daoducai","name":"Inverted-Jar Mustard Greens (Daoducai)","place":"Jiande, Hangzhou and the sandy Qiantang plain in Zhejiang.","materials":"Local mustard greens, including jiutoujie and broad-leaf varieties, and salt.","process":"Mustard is washed, wilted and allowed to yellow, then chopped, rubbed with salt and pressed to remove liquid. It is tightly packed with a wooden stick into a jar, which is turned upside down for low-moisture fermentation. The inverted jar is its most recognizable process feature.","taste":"Savory, salty and mellow, retaining mustard character. Acidity varies with maturation.","eat":"Daoducai stir-fried with spring bamboo shoots; Daoducai with edamame or chili; An ingredient used by some Hangzhou pian'erchuan noodle shops; Steamed dishes or soups.","photo":"assets/photos/cn-zhejiang-daoducai.jpg","credit":"Huang Baoqing, Tide News / Zhejiang Online · Copyright retained by the source; no open license stated · https://zjnews.zjol.com.cn/zjnews/202307/t20230704_25930877.shtml","sourceUrl":"https://wgly.hangzhou.gov.cn/art/2022/11/24/art_1229696390_58943042.html","sourceTitle":"A Hundred Counties, a Thousand Bowls — Hangzhou Culture and Tourism Bureau","photoKind":"Prepared food","photoCaption":"Daoducai sold at a market in Hangzhou.","categoryLabel":"Regional pickle","photoSource":"https://zjnews.zjol.com.cn/zjnews/202307/t20230704_25930877.shtml","catalogName":"Inverted-Jar Mustard Greens","lat":29.47,"lon":119.28},{"id":"cn-yangzhou-jiangcai","name":"Yangzhou Sauce-Pickled Vegetables (Jiangcai)","place":"Yangzhou, Jiangsu.","materials":"Vegetables such as baby cucumbers, crosnes, small radishes and tender ginger; salt and fermented sauce. Recipes depend on the product.","process":"Vegetables are selected, trimmed and initially pickled, then matured in sauce to develop a salty-sweet, fermented-sauce flavor. The use of fermented sauce alone does not prove that each vegetable itself undergoes lactic fermentation.","taste":"Fresh, sweet, crisp and tender, with balanced salt and sweetness rather than strong acidity.","eat":"Sauce-pickled baby cucumber; Sauce-pickled crosnes; Mixed sauce pickles; Sweet-sauce melon or cucumber.","photo":"assets/photos/cn-yangzhou-jiangcai.jpg","credit":"Sanhe Simei official store on Suning · Copyright retained by the source; no open license stated · https://product.suning.com/0070096370/172125930.html","sourceUrl":"https://xccys.moa.gov.cn/ncpjg/201907/t20190716_6320998.htm","sourceTitle":"Four Field Examples of Yangzhou's Rural Industries — Ministry of Agriculture and Rural Affairs","photoKind":"Product example","photoCaption":"Product example: assorted Sanhe Simei sauce pickles, one producer’s take on Yangzhou pickles.","categoryLabel":"Sauce-pickled cousin","photoFit":"contain","photoSource":"https://product.suning.com/0070096370/172125930.html","catalogName":"Yangzhou Sauce-Pickled Vegetables","lat":32.39,"lon":119.42},{"id":"cn-beijing-jiangcai","name":"Beijing Traditional Sauce Pickles","place":"Beijing.","materials":"Cucumber, kohlrabi and other vegetables; salt; sweet wheat paste or soybean sauce.","process":"Vegetables are first salted, then desalted and cut into shreds, chunks or strips as needed. In the traditional craft, small cloth bags of vegetables are immersed in specially prepared sweet wheat or soybean sauce and turned to absorb flavor evenly.","taste":"Rich sauce flavor with sweetness and savory depth; the salt-sugar balance varies by variety.","eat":"Maren jinsi, sesame-coated fine kohlrabi shreds; Small cucumbers in sweet sauce; Sweet-sauce cucumber strips finished with hot oil.","photo":"assets/photos/cn-beijing-jiangcai.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Liubiju_pickles_at_CIFTIS_(20250910163843).jpg","sourceUrl":"https://www.ihchina.cn/art/detail/id/10242.html","sourceTitle":"Craftspeople Around Us: Liubiju Heritage Bearer Yang Yinxi — China Intangible Cultural Heritage","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Sauce-pickled cousin","catalogName":"Beijing Traditional Sauce Pickles","lat":39.92,"lon":116.4},{"id":"cn-hangzhou-shuangchagua","name":"Hangzhou Sauce-Pickled Cucumber (Shuangchagua)","place":"Hangzhou, Zhejiang; Jingyangguan is a representative producer.","materials":"Cucumber, salt and a sauce-pickling medium.","process":"Fresh cucumbers are salted to remove water, then placed in sauce crocks. The name is associated with two traditional salting stages. This Hangzhou specialty should not be equated with naturally lactic-fermented brine cucumbers.","taste":"Pleasantly salty-sweet, with sauce complementing the cucumber.","eat":"A small dish of shuangchagua beside paofan rice.","photo":"assets/photos/cn-hangzhou-shuangchagua.jpg","credit":"Fumikas Sagisavas · CC0 · https://commons.wikimedia.org/wiki/File:Yonghui_pickled_cucumber.jpg","sourceUrl":"https://hznews.hangzhou.com.cn/chengshi/content/2025-07/20/content_9042580.htm","sourceTitle":"Remembering Jingyangguan Sauce Cucumbers — Hangzhou Net Interview with Shop Manager Yuan Penghong","photoKind":"Prepared food","photoCaption":"A related cucumber pickle, rather than Hangzhou shuangchagua itself.","categoryLabel":"Sauce-pickled cousin","catalogName":"Hangzhou Sauce-Pickled Cucumber","lat":30.27,"lon":120.15},{"id":"cn-chaoshan-xiancai","name":"Chaoshan Sour Mustard Greens (Xiancai)","place":"Chaoshan, Guangdong, including the traditions of Chenghai and Waisha in Shantou.","materials":"Mustard greens, locally called dacai, and salt.","process":"The greens are wilted in the sun, salted, packed down and fermented. Finished greens may be rinsed to reduce their saltiness before cutting. This specific mustard-green tradition differs from Sichuan paocai, where several vegetables may share an established brine.","taste":"Sour and salty, sometimes with a gently sweet finish.","eat":"Chopped greens with plain rice porridge; Pork-stomach soup with xiancai; Fish braised with xiancai, or fish soup.","photo":"assets/photos/meal-fish-pickled-mustard-plate.jpg","credit":"Alpha from Melbourne, Australia · CC BY-SA 2.0 · https://commons.wikimedia.org/wiki/File:Flake_and_Pickled_Mustard_Greens_(3697782134).jpg","sourceUrl":"https://www.gdlonghu.gov.cn/lh/ztzl/lhwhg/fywh/lhfy/content/post_2241326.html","sourceTitle":"Longhu District Cultural Center: The Traditional Craft of Preserving Chaoshan Xiancai","licenseUrl":"https://creativecommons.org/licenses/by-sa/2.0","photoKind":"Serving example","photoCaption":"Serving example: fish with pickled mustard greens, not photographed in Chaoshan.","categoryLabel":"Regional pickle","catalogName":"Chaoshan Sour Mustard Greens","lat":23.66,"lon":116.62},{"id":"cn-chaoshan-ganlancai","name":"Chaoshan Olive and Mustard-Green Relish (Ganlancai)","place":"Chaoshan, Guangdong, including Longhu and Chenghai in Shantou.","materials":"Mustard greens, Chinese olives, vegetable oil and salt; some products include additional spices.","process":"Traditional production can begin by salt-fermenting mustard greens. The greens are then desalted, chopped and drained, before being slowly cooked with prepared Chinese olives and oil. The finished product is a cooked, oil-rich relish.","taste":"Salty, savory and concentrated, combining olive and mustard-green flavors.","eat":"A spoonful alongside rice porridge or steamed rice; A seasoning for fried rice, steamed meat or vegetables in modern cooking.","photo":"assets/photos/meal-ganlancai-green-beans.jpg","credit":"Jpatokal · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Green_beans_with_olive_vegetable.jpg","sourceUrl":"https://wsjkw.gd.gov.cn/attachment/0/398/398120/3056237.pdf","sourceTitle":"Guangdong Local Food-Safety Standard DBS 44/014—2019: Ganlancai","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example: green beans stir-fried with olive and mustard-green relish.","categoryLabel":"Regional pickle","catalogName":"Chaoshan Olive and Mustard-Green Relish","lat":23.42,"lon":116.78},{"id":"cn-huizhou-meicai","name":"Huizhou Preserved Mustard Greens (Meicai)","place":"Huizhou, Guangdong; Hengli and Aipi in Huicheng are representative production areas.","materials":"Large-leaf mustard greens and salt; sugar is added for sweet meicai.","process":"Traditional production combines dry salting with sun-drying, piled maturation and final preparation. Sweet and salted versions are distinguished by added sugar. Despite the name, it contains no plums and is not automatically identical to fully dried Zhejiang meigancai.","taste":"Salty and deeply savory; sweet meicai has an additional sweetness.","eat":"Meicai kourou, pork belly with preserved greens; Meicai steamed with meat; Meicai steamed with fish; Pork patty with meicai.","photo":"assets/photos/meal-meizhou-preserved-greens-pork.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Steamed_Sliced_Pork_Belly_with_Preserved_Vegetable_in_Meizhou_(20200928174231).jpg","sourceUrl":"https://wsjkw.gd.gov.cn/attachment/0/398/398121/3056236.pdf","sourceTitle":"Guangdong Local Food-Safety Standard DBS 44/015—2019: Huizhou Meicai","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example: pork belly with preserved mustard greens in Meizhou, not Huizhou.","categoryLabel":"Regional pickle","catalogName":"Huizhou Preserved Mustard Greens","lat":23.11,"lon":114.41},{"id":"cn-hakka-suancai-taiwan","name":"Hakka Sour Mustard Greens (Taiwan Tradition)","place":"Hakka communities in Taiwan, including Miaoli. These traditions are culturally related to Hakka preserves in Guangdong, Fujian and Jiangxi, but one recipe does not represent all Hakka communities.","materials":"Large mustard greens and salt.","process":"Sun-wilted greens are rubbed with salt to release liquid, packed firmly and fermented. This is the wetter stage in a related mustard-green preservation sequence; further dehydration and maturation can produce fucai and meigancai.","taste":"Sour and salty, with a gently sweet-sour character in soup.","eat":"Pork stomach braised with suancai; Suancai and pork-rib soup; Suancai stewed with duck.","photo":"assets/photos/ingredient-leaf-mustard.jpg","credit":"thebittenword.com · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Mustardgreensraw.jpg","sourceUrl":"https://fae.moa.gov.tw/map/food_item.php?id=42&type=AS08","sourceTitle":"Ministry of Agriculture Food Education Platform: Mustard Greens and Their Pickled-Preserve Family","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: mustard greens, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Hakka Sour Mustard Greens","lat":24.62,"lon":120.75},{"id":"cn-hakka-fucai","name":"Hakka Semi-Dried Mustard Greens (Fucai)","place":"Hakka communities in Taiwan; Gongguan in Miaoli is especially associated with this preserve.","materials":"Salt-preserved mustard greens and salt.","process":"Suancai is further processed through repeated drying, salting and firm packing into jars or bottles, then sealed for maturation. Containers were traditionally sometimes inverted. The product is drier than suancai but less dry than meigancai.","taste":"Salty-sour with a rounded, mellow finish.","eat":"Fucai and sliced-pork soup; Fucai and sliced pork-stomach soup; Fucai simmered with meat.","photo":"assets/photos/ingredient-leaf-mustard.jpg","credit":"thebittenword.com · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Mustardgreensraw.jpg","sourceUrl":"https://www.mdares.gov.tw/ws.php?id=1372","sourceTitle":"Miaoli District Agricultural Research and Extension Station: Mustard Greens, Fragrant Fucai and Agricultural Heritage","licenseUrl":"https://creativecommons.org/licenses/by/2.0/","photoKind":"Ingredient example","photoCaption":"Ingredient example: mustard greens, not a finished pickle or a sample from this region.","categoryLabel":"Regional pickle","catalogName":"Hakka Semi-Dried Mustard Greens","lat":24.5,"lon":120.87},{"id":"cn-hakka-meigancai-taiwan","name":"Hakka Dried Mustard Greens (Taiwan Tradition)","place":"Hakka communities in Taiwan, including the mustard-green preservation traditions of Miaoli.","materials":"Previously salted and fermented mustard greens.","process":"Suancai or fucai is sun-dried further for storage, then softened and cooked when needed. It represents a drier stage in the same preservation sequence as wet suancai and semi-dried fucai.","taste":"Salty, gently sweet-sour, with a lingering sweetness associated with dried greens.","eat":"Pork belly with meigancai; Rice topped with pork and meigancai; Meigancai steamed or stewed with pork.","photo":"assets/photos/meigancai-bundle.jpg","credit":"Sjschen · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:MeiganCaiBundle.jpg","sourceUrl":"https://fae.moa.gov.tw/theme_data.php?id=41&sub_theme=knowledge&theme=topics","sourceTitle":"Food Education Platform: Mustard Greens, the Long-Life Vegetable","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Hakka Dried Mustard Greens","lat":24.4,"lon":120.8},{"id":"cn-chaoshan-caipu","name":"Chaoshan Preserved Radish and Aged Radish (Caipu)","place":"Chaoshan, Guangdong, including Chenghai. Hakka communities also preserve radish, and those traditions are best compared as regional branches.","materials":"White radish and salt; some aged-radish methods include spices.","process":"The radish is salted, repeatedly sun-dried and pressed, then stored in earthenware containers. Long-matured forms are called lao caipu. Traditional storage can include fermentation, but simple salt-dried radish is not automatically the same ferment.","taste":"Younger caipu is salty with a gentle sweetness; aged caipu is more concentrated.","eat":"Caipu with plain rice porridge; Caipu omelet; Clay-pot porridge with aged caipu; Aged caipu in fish or meat soup.","photo":"assets/photos/caipu-dried-radish.jpg","credit":"Fumikas Sagisavas · CC0 · https://commons.wikimedia.org/wiki/File:Dried_radishes_(20240929).jpg","sourceUrl":"https://www.shantou.gov.cn/nyj/zwgk/gzdt/content/post_2120531.html","sourceTitle":"Shantou Agriculture and Rural Affairs Bureau: New Flavors for Chaoshan Aged Caipu","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Chaoshan Preserved Radish and Aged Radish","lat":23.75,"lon":116.48},{"id":"cn-guangxi-suansun","name":"Guangxi Sour Bamboo Shoots (Suansun)","place":"Several parts of Guangxi, especially their use in Liuzhou luosifen and Nanning laoyoufen. Other provinces also ferment bamboo shoots.","materials":"Bamboo shoots, with species varying by locality, and water; some processes use brine or a fermentation starter.","process":"Whole, sliced or shredded shoots ferment and acidify in water or brine. Spontaneous and inoculated processes coexist. This is more than simply immersing shoots in vinegar.","taste":"Sour and savory, with a pronounced bamboo-shoot character.","eat":"A
