topping for Liuzhou luosifen rice-noodle soup; A source of sour aroma in Nanning laoyoufen; Stir-fried with meat.","photo":"assets/photos/meal-liuzhou-luosifen-bowl.jpg","credit":"N509FZ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Luosifen_at_Guangya,_Liuzhou_(20190420141814).jpg","sourceUrl":"https://lzqsi.org.cn/a/1084.html","sourceTitle":"Liuzhou Quality Inspection and Testing Research Center: Understanding Sour Bamboo Shoots","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example; the photo does not establish the pickle’s origin or preparation method.","categoryLabel":"Regional pickle","catalogName":"Guangxi Sour Bamboo Shoots","lat":23.5,"lon":108.9},{"id":"cn-nanning-suanye-adjacent","name":"Nanning Vinegar-Pickled Fruit and Vegetables (Suanye)","place":"Nanning and surrounding Guangxi communities; styles differ across the wider region.","materials":"Seasonal fruit and vegetables such as papaya, radish and cucumber; rice vinegar, salt and sugar; often chili-based seasoning at serving.","process":"Prepared fruit and vegetables are cut and pickled with rice vinegar, sugar and salt, then seasoned to taste. The method described by the cultural center primarily acidifies the food with added vinegar.","taste":"Sour, sweet, salty and spicy, adjusted by the stallholder or diner.","eat":"A single type of pickled fruit or vegetable; A mixed suanye plate; Served with a dip or tossed in seasoning.","photo":"assets/photos/cn-nanning-suanye-adjacent.jpg","credit":"EditQ · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:%E9%85%B8%E5%98%A2.jpg","sourceUrl":"https://nnsjnqwhg.org.cn/Intangible/zzqj/578.html","sourceTitle":"Jiangnan District Cultural Center, Nanning: The Traditional Craft of Making Suanye","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Vinegar-pickled cousin","catalogName":"Nanning Vinegar-Pickled Fruit and Vegetables","lat":22.82,"lon":108.37},{"id":"cn-minqing-zaocai","name":"Minqing Red Wine-Lees Mustard Greens (Zaocai)","place":"Minqing, Fuzhou, Fujian, where it is counted among the area's three characteristic local products.","materials":"Mustard greens, red rice-wine lees (hongzao) and salt.","process":"Prepared mustard greens are preserved and fermented with red wine lees and salt. The lees provide both flavor and a processing medium; this differs from simply tossing fresh vegetables with red lees immediately before cooking.","taste":"Sour and salty, with a rounded wine-lees character.","eat":"Zaocai rice-vermicelli soup; Zaocai and pork-rib soup; A flavoring ingredient in soups and stir-fries.","photo":"assets/photos/meal-zaocai-noodles-sibu.jpg","credit":"Bubucar7879 · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:%E7%B3%9F_%E8%8F%9C_%E7%B2%89_%E5%B9%B2.jpg","sourceUrl":"https://www.fzmq.gov.cn/xjwz/zjmq/zrdl/201704/t20170413_391146.htm","sourceTitle":"Minqing County Government: Local Products, Zaocai","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","photoKind":"Serving example","photoCaption":"Serving example: wine-lees mustard greens with rice noodles in Sibu, not Minqing.","categoryLabel":"Regional pickle","catalogName":"Minqing Red Wine-Lees Mustard Greens","lat":26.22,"lon":118.86}],"world":[{"id":"WORLD-01","name":"Kimchi","local":"김치","place":"Korea and Korean diaspora communities","materials":"Napa cabbage, radish, cucumber and seasonings","process":"A diverse family of fermented vegetables, from spicy cabbage kimchi to crisp radish cubes and refreshing watery dongchimi. Recipes vary; freshly dressed geotjeori is not necessarily fully fermented.","taste":"From spicy cabbage and crisp radish to refreshing watery kimchi.","eat":"Everyday side dishes; mature cabbage kimchi also enters stews and pancakes.","photo":"assets/photos/world-01.jpg","credit":"AhmadElq · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Korean_Kimchi.jpg","sourceUrl":"https://english.visitkorea.or.kr/svc/contents/infoBscView.do?vcontsId=140728","sourceTitle":"Kimchi — Korea Tourism Organization","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Kimchi"},{"id":"WORLD-02","name":"Sauerkraut","local":"Sauerkraut / Choucroute","place":"Germany, Central and Eastern Europe, and Alsace","materials":"White cabbage and salt","process":"Finely shredded cabbage undergoes lactic fermentation in its own salted juices, developing a clean sour taste. Sauerkraut spans several regional traditions; the prepared Alsatian meat dish is a separate serving form.","taste":"Clean, tangy sourness.","eat":"A sour side dish, or cooked with sausages, pork and potatoes.","photo":"assets/photos/world-02.jpg","credit":"Alina Zienowicz Ala z · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:Kiszona_kapusta.JPG","sourceUrl":"https://ask.ifas.ufl.edu/publication/FS474","sourceTitle":"Fermented Foods: Sauerkraut — University of Florida IFAS","photoKind":"Prepared food","photoCaption":"A related preparation: fermented sauerkraut, photographed outside Germany.","categoryLabel":"Regional pickle","catalogName":"Sauerkraut"},{"id":"WORLD-03","name":"Brine-fermented cucumber pickles","local":"Fermented cucumber pickles / Ogórki kiszone","place":"Central and Eastern Europe and beyond","materials":"Small cucumbers, brine, and sometimes dill or garlic","process":"Cucumbers become sour through microbial fermentation in brine while retaining a crisp bite. “Dill pickle” does not guarantee fermentation; some products are directly vinegar-pickled.","taste":"Sour, with a crisp bite.","eat":"Whole or sliced sides; fermented cucumbers and brine also flavour Polish cucumber soup.","photo":"assets/photos/world-03.jpg","credit":"Nikodem Nijaki · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:Polish_style_pickled_cucumbers_IMGP0413.jpg","sourceUrl":"https://nchfp.uga.edu/how/ferment/general-information-on-fermenting/","sourceTitle":"General Information on Fermenting — National Center for Home Food Preservation","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Brine-fermented cucumber pickles"},{"id":"WORLD-04","name":"Nukazuke","local":"ぬか漬け / Nukazuke","place":"Japan","materials":"Cucumber, eggplant, radish and a salted rice-bran bed","process":"Vegetables mature in a fermented rice-bran bed, acquiring sour, savoury flavours and a distinctive bran aroma. Nukazuke is one fermentation-based tradition within the much wider tsukemono category.","taste":"Sour and savory, with a distinctive rice-bran aroma.","eat":"The bran is removed and the vegetables are sliced into small accompaniments.","photo":"assets/photos/world-04.jpg","credit":"DoWhile · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:Nukazuke.jpg","sourceUrl":"https://www.maff.go.jp/j/heya/kodomo_sodan/0102/04.html","sourceTitle":"What happens when vegetables are pickled in rice bran? — Japan Ministry of Agriculture, Forestry and Fisheries","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Nukazuke"},{"id":"WORLD-05","name":"Sugukizuke","local":"すぐき漬け / Sugukizuke","place":"Kamigamo, Kyoto, Japan","materials":"Suguki turnip roots, leaves and salt","process":"This Kyoto turnip pickle develops a pronounced lactic sourness, with contrasting root and leaf textures. It names a specific local turnip tradition, not every fermented turnip.","taste":"Pronounced sourness; roots and leaves offer different textures.","eat":"With rice or ochazuke; also a year-end and New Year gift.","photo":"assets/photos/world-05.jpg","credit":"農林水産省 · CC BY 4.0 · https://commons.wikimedia.org/wiki/File:Suguki.jpg","sourceUrl":"https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sugukizuke_kyoto.html","sourceTitle":"Sugukizuke, Kyoto Prefecture — Japan Ministry of Agriculture, Forestry and Fisheries","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Sugukizuke"},{"id":"WORLD-06","name":"Nama-shibazuke","local":"生しば漬け / Nama-shibazuke","place":"Ohara, Kyoto, Japan","materials":"Eggplant, red shiso and salt","process":"Traditional nama-shibazuke is salt-fermented, with a purple-red colour, clear sourness and fragrant shiso. Modern shibazuke may use added acidic seasonings rather than the same fermentation route.","taste":"Bright sourness and fragrant shiso, with a purple-red color.","eat":"Small pieces accompany rice or drinks; preparation connects with the summer shiso harvest.","photo":"assets/photos/world-06.jpg","credit":"Vegan Feast Catering · CC BY 2.0 · https://commons.wikimedia.org/wiki/File:Shibazuke_(4357771471).jpg","sourceUrl":"https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/shibazuke_kyoto.html","sourceTitle":"Shibazuke, Kyoto Prefecture — Japan Ministry of Agriculture, Forestry and Fisheries","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Nama-shibazuke"},{"id":"WORLD-07","name":"Takanazuke","local":"高菜漬け / Takanazuke","place":"Kyushu, especially Chikugo in Fukuoka, Japan","materials":"Takana mustard greens and salt; seasonings vary","process":"Mature takana pickles develop a deeper colour and fermented flavour than short-aged versions. Distinguish longer-fermented furuzuke from fresher, briefly pickled asazuke.","taste":"Deep, matured pickle flavor and a darker color.","eat":"With rice, rice balls or ramen; mature greens are also stir-fried.","photo":"assets/photos/world-07.jpg","credit":"博多からきた女 · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Pickled_Takana_Mustard.JPG","sourceUrl":"https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/takana_zuke.html","sourceTitle":"Takanazuke — Japan Ministry of Agriculture, Forestry and Fisheries","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Takanazuke"},{"id":"WORLD-08","name":"Vietnamese fermented mustard greens","local":"Dưa cải chua / Dưa cải muối","place":"Vietnam","materials":"Mustard greens and brine","process":"Dưa cải chua is typically sour and salty, with crisp stems and softer leaves produced through lactic fermentation. Ingredients and maturation vary; fermented eggplant, cà muối, is a related but separate food.","taste":"Sour and salty, with crisp stems and softer leaves.","eat":"An everyday vegetable accompaniment to home meals.","photo":"assets/photos/world-08.jpg","credit":"Casablanca1911 at Vietnamese Wikipedia · Public domain · https://commons.wikimedia.org/wiki/File:D%C6%B0a_c%E1%BA%A3i_mu%E1%BB%91i.JPG","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/23500611/","sourceTitle":"A description of the lactic acid bacteria microbiota associated with the production of traditional fermented vegetables in Vietnam","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Vietnamese fermented mustard greens"},{"id":"WORLD-09","name":"Pak-sian-dorng","local":"ผักเสี้ยนดอง / Pak-sian-dorng","place":"Northeastern Thailand","materials":"Cleome gynandra shoots, leaves and flowers; salt and cooked rice","process":"Tender plant parts ferment with salt and cooked rice, producing a sour, salty vegetable side. The botanical name matters: similarly translated common plant names may refer to different species.","taste":"Sour and salty.","eat":"Served with nam prik chilli dipping sauce in household meals.","photo":"assets/photos/world-09.jpg","credit":"JIRCAS Database of Fermented Foods of Thailand · JIRCAS website terms of use · https://www.jircas.go.jp/en/database/thaifermented/pak-sian-dorng","sourceUrl":"https://www.jircas.go.jp/en/database/thaifermented/pak-sian-dorng","sourceTitle":"JIRCAS：Pak-sian-dorng","photoKind":"Prepared food","photoCaption":"Pak-sian-dorng, from the JIRCAS Database of Fermented Foods of Thailand.","categoryLabel":"Regional pickle","licenseUrl":"https://www.jircas.go.jp/en/about/guide","photoSource":"https://www.jircas.go.jp/en/database/thaifermented/pak-sian-dorng","catalogName":"Pak-sian-dorng"},{"id":"WORLD-10","name":"Gundruk","local":"Gundruk","place":"Nepal and neighbouring Himalayan regions, including Sikkim","materials":"Mustard, radish, cabbage or cauliflower leaves","process":"Leafy vegetables ferment before drying, developing a concentrated sour aroma and darker colour. Fermentation before drying distinguishes gundruk from vegetables that are simply sun-dried.","taste":"Concentrated sourness and a fermented aroma.","eat":"Rehydrated in soups and stews, or prepared as a side.","photo":"assets/photos/world-10.jpg","credit":"Gaurav Dhwaj Khadka · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Gundruk_1.jpg","sourceUrl":"https://pubmed.ncbi.nlm.nih.gov/33133561/","sourceTitle":"Kinetics and modeling of growth and lactic acid production in Gundruk, a Himalayan fermented vegetable dish","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Gundruk"},{"id":"WORLD-11","name":"Sinki","local":"Sinki","place":"Nepal and Himalayan regions including Sikkim","materials":"Radish roots","process":"Traditionally compacted radish roots ferment in a pit and are subsequently cut and dried for storage. Sinki is not another name for gundruk: the raw material and traditional processing differ.","taste":"Sour when rehydrated.","eat":"Rehydrated for sour soups, sides or stews.","photo":"assets/photos/world-11.jpg","credit":"Eastern Himalayas · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Sinki_ko_jhol_(Fermented_radish_soup).jpg","sourceUrl":"https://www.sciencedirect.com/science/article/pii/S0168160505003351","sourceTitle":"Identification of predominant lactic acid bacteria isolated from traditionally fermented vegetable products of the Eastern Himalayas","photoKind":"Prepared food","photoCaption":"Serving example: sour soup with sinki, fermented radish.","categoryLabel":"Regional pickle","catalogName":"Sinki"},{"id":"WORLD-12","name":"Soibum","local":"Soibum","place":"Manipur, northeastern India","materials":"Young bamboo shoots","process":"Bamboo shoots mature through an acidic fermentation involving lactic acid bacteria; some traditions use no added salt. Soidon and soijim are related named products, not interchangeable aliases for soibum.","taste":"Sour.","eat":"An ingredient in local everyday cooking and market foods.","photo":"assets/photos/world-12.jpg","credit":"Shantikh · CC BY-SA 3.0 · https://commons.wikimedia.org/wiki/File:Soibum,_a_traditional_Meitei_ethnic_food,_derived_from_bamboo_shoots,_is_a_Manipuri_delicacy.jpg","sourceUrl":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4252422/","sourceTitle":"Phenotypic identification and technological attributes of native lactic acid bacteria present in fermented bamboo shoot products from North-East India","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Soibum"},{"id":"WORLD-13","name":"Fermented table olives","local":"Fermented table olives","place":"Mediterranean regions including Greece, Türkiye and Spain","materials":"Olea europaea fruit and brine","process":"Selected olive-processing traditions use brine fermentation, producing salty, mildly sour fruit with varying bitterness and firmness. Not all table olives are fermented; these fruits are included as a culinary extension, distinct from Chinese olives.","taste":"Salty and mildly sour; bitterness and firmness vary.","eat":"Appetisers, snacks, salads and cooked dishes.","photo":"assets/photos/world-13.jpg","credit":"PattayaPatrol · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:DFC_3933_A_close-up_of_a_pile_of_pitted_green_olives_showing_their_smooth_glossy_skins_and_hollow_centers.jpg","sourceUrl":"https://www.internationaloliveoil.org/olive-world/table-olives/","sourceTitle":"Table olives — International Olive Council","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Regional pickle","catalogName":"Fermented table olives"},{"id":"WORLD-B01","name":"Turşu","local":"Turşu","place":"Türkiye","materials":"Cucumbers, cabbage, peppers, carrots, beans and other vegetables","process":"Turşu is a broad pickle category whose preparation may involve brine fermentation or directly added vinegar or lemon juice. Record the actual process rather than classifying every turşu as fermented.","taste":"Tangy and sour.","eat":"Table accompaniments; some pickled beans are fried with onion and garlic.","photo":"assets/photos/world-b01.jpg","credit":"Raimond Spekking · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Mixed_Pickles_(9370-72).jpg","sourceUrl":"https://www.kulturportali.gov.tr/turkiye/van/neyenir/tursu","sourceTitle":"Turşu — Türkiye Culture Portal","photoKind":"Prepared food","photoCaption":"A related preparation: mixed vegetable pickles, not photographed in Türkiye.","categoryLabel":"Regional pickle","catalogName":"Turşu"},{"id":"WORLD-B02","name":"Pikliz","local":"Pikliz","place":"Haiti and Haitian diaspora communities","materials":"Shredded cabbage, carrot, onion, hot peppers and vinegar","process":"This crunchy, sour and hot condiment is commonly preserved with added vinegar rather than vegetable lactic fermentation. Included as a neighbouring pickle tradition, not a core fermented-vegetable entry.","taste":"Crunchy, sour and hot.","eat":"Alongside griot, fried chicken or fish, and fried plantain.","photo":"assets/photos/world-b02.jpg","credit":"Aliceba · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Haitian_Pikliz.jpg","sourceUrl":"https://kanpe.org/en/news/haitian-pikliz-a-taste-of-haitis-warmth-to-your-holiday/","sourceTitle":"Haitian Pikliz: a taste of Haiti’s warmth to your holiday! — KANPE","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Vinegar-pickled cousin","catalogName":"Pikliz"},{"id":"WORLD-B03","name":"Gari","local":"ガリ / Gari","place":"Japan","materials":"Thin ginger slices, sugar and vinegar","process":"Thin ginger slices are steeped in sweet vinegar, producing a crisp, sweet-sour accompaniment with ginger warmth. Fermented vinegar as an ingredient does not mean the ginger itself has undergone vegetable fermentation.","taste":"Crisp and sweet-sour, with ginger warmth.","eat":"Small portions served as a condiment, familiar from sushi meals.","photo":"assets/photos/world-b03.jpg","credit":"CNEcija12345 · CC BY-SA 4.0 · https://commons.wikimedia.org/wiki/File:Gari_(Pickled_sushi_ginger).jpg","sourceUrl":"https://www.nsouzai-kyoukai.or.jp/pickled-ginger/","sourceTitle":"Gari — Japan Ready-made Meal Association","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Vinegar-pickled cousin","catalogName":"Gari"},{"id":"WORLD-14","name":"Kawal","local":"Kawal","place":"Western Sudan, especially Kordofan and Darfur; related traditions in Chad","materials":"Cassia obtusifolia, also called Senna obtusifolia, leaves","process":"Fermented leaves are dried into a dark, strongly aromatic seasoning rather than a crisp sour pickle. Not a typical lactic ferment; its specialised processing should not be treated as a home recipe.","taste":"Strongly aromatic; a seasoning rather than a crisp, sour pickle.","eat":"Added to onion or okra sauces and stews accompanying grain porridge.","photo":"assets/photos/world-14.jpg","credit":"Sacred Agriculture · CC BY 3.0 · https://commons.wikimedia.org/wiki/File:Kawal,_after_fermentation.jpg","sourceUrl":"https://scijournals.onlinelibrary.wiley.com/doi/abs/10.1002/jsfa.2740360919","sourceTitle":"Biochemical and microbiological studies on kawal, a meat substitute derived by fermentation of Cassia obtusifolia leaves","photoKind":"Prepared food","photoCaption":"Photographed preparation; regional recipes, maturity and serving styles may vary.","categoryLabel":"Fermented-leaf cousin","catalogName":"Kawal"}]};

const canvas = document.getElementById('globe');

let detailEntry=null,globeTop=0;
function isPhoneLayout(){return W<760||(W<=1024&&H<=600&&matchMedia('(pointer: coarse)').matches);}
function usesSplitDetail(){return !!detailEntry&&!isPhoneLayout();}
function detailWidth(){return Math.min(440,Math.max(320,window.innerWidth*.38));}
function detailMapRight(){return usesSplitDetail()?W-detailWidth()-24:W;}
function detailMapBottom(){return H;}
// Center the visible map and reading column; use a compact, explicit globe gap.
function centerDetailPair(mapLeft,mapRight=null){
  const pane=document.getElementById('foodDetail');
  if(!usesSplitDetail()){pane.style.right='0px';return 0;}
  const paneWidth=detailWidth();
  const measured=pane.querySelector('.detail-content')?.getBoundingClientRect().width;
  const contentWidth=measured>0&&measured<=paneWidth?measured:Math.min(360,paneWidth-56);
  const cardInset=(paneWidth-contentWidth)/2;
  if(!cnOpen&&mapRight!==null){
    const gap=Math.max(72,Math.min(128,W*.095));
    const mapWidth=mapRight-mapLeft;
    const left=(W-mapWidth-gap-contentWidth)/2;
    const contentRight=left+mapWidth+gap+contentWidth;
    pane.style.right=(W-contentRight-cardInset)+'px';
    return mapLeft-left;
  }
  const shift=(mapLeft-cardInset)/2;
  pane.style.right=shift+'px';
  return shift;
}
// The desktop reading viewport shares the map's visible top and bottom edges.
function fitDetailHeight(top,bottom){
  const pane=document.getElementById('foodDetail');
  if(!usesSplitDetail()){
    pane.style.removeProperty('--detail-top');pane.style.removeProperty('--detail-height');return;
  }
  const start=Math.max(0,top),end=Math.min(H,bottom);
  pane.style.setProperty('--detail-top',start+'px');
  pane.style.setProperty('--detail-height',Math.max(0,end-start)+'px');
}

function toSphere(lon, lat){
  const lam = (lon - yaw) * D2R, phi = lat * D2R, cp = Math.cos(phi);
  const X = cp * Math.sin(lam), Y = Math.sin(phi), Z = cp * Math.cos(lam);
  const ct = Math.cos(pitch * D2R), st = Math.sin(pitch * D2R);
  return { x: X, y: Y * ct - Z * st, z: Y * st + Z * ct };
}

const RING_N = LAND.length;
const RSTART = new Int32Array(RING_N), RLEN = new Int32Array(RING_N);
const TOTAL = LAND.reduce((a, r) => a + r.length, 0);
const SINLON = new Float32Array(TOTAL), COSLON = new Float32Array(TOTAL);
const SINLAT = new Float32Array(TOTAL), COSLAT = new Float32Array(TOTAL);

{
  let k = 0;
  LAND.forEach((ring, i) => {
    RSTART[i] = k; RLEN[i] = ring.length;
    let lonSum = 0;

    RING_LON[i] = lonSum / ring.length;
  });
}

  for (let i = 0; i < TOTAL; i++){
    const cp = COSLAT[i], sp = SINLAT[i];
    const sl = SINLON[i] * cosY - COSLON[i] * sinY;
    const cl = COSLON[i] * cosY + SINLON[i] * sinY;
    const X = cp * sl, Y = sp, Z = cp * cl;
    XS[i] = X; YS[i] = Y * ct - Z * st; ZS[i] = Y * st + Z * ct;
  }
}

/* 裁剪后的多边形：夹在球缘上的那几段要沿圆弧走，直接拉直线就像被切了一刀 */
function traceClipped(ctx, cx, cy, R, m){
  ctx.moveTo(cx + R * CXB[0], cy - R * CYB[0]);
  for (let k = 1; k < m; k++){
    if (HOR[k] && HOR[k - 1]){
      const a0 = Math.atan2(-CYB[k - 1], CXB[k - 1]);
      const a1 = Math.atan2(-CYB[k], CXB[k]);
      let d = a1 - a0;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      ctx.arc(cx, cy, R, a0, a1, d < 0);
    } else {
      ctx.lineTo(cx + R * CXB[k], cy - R * CYB[k]);
    }
  }
  if (HOR[m - 1] && HOR[0]){
    const a0 = Math.atan2(-CYB[m - 1], CXB[m - 1]);
    const a1 = Math.atan2(-CYB[0], CXB[0]);
    let d = a1 - a0;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    ctx.arc(cx, cy, R, a0, a1, d < 0);
  }
  ctx.closePath();
}

/* 中国轮廓：和世界海岸线一样预先摊平，每帧只算数 */
const C_N = CHINA.length;
const C_START = new Int32Array(C_N), C_LEN = new Int32Array(C_N);
const C_TOT = CHINA.reduce((a, r) => a + r.length, 0);
const CSINLON = new Float32Array(C_TOT), CCOSLON = new Float32Array(C_TOT);
const CSINLAT = new Float32Array(C_TOT), CCOSLAT = new Float32Array(C_TOT);
const CX = new Float32Array(C_TOT), CY = new Float32Array(C_TOT), CZ = new Float32Array(C_TOT);
{
  let k = 0;
  CHINA.forEach((ring, i) => {
    C_START[i] = k; C_LEN[i] = ring.length;
    for (const [lon, lat] of ring){
      const l = lon * D2R, p = lat * D2R;
      CSINLON[k] = Math.sin(l); CCOSLON[k] = Math.cos(l);
      CSINLAT[k] = Math.sin(p); CCOSLAT[k] = Math.cos(p);
      k++;
    }
  });
}
function projectChina(){
  const sinY = Math.sin(yaw * D2R), cosY = Math.cos(yaw * D2R);
  const ct = Math.cos(pitch * D2R), st = Math.sin(pitch * D2R);
  for (let i = 0; i < C_TOT; i++){
    const cp = CCOSLAT[i], sp = CSINLAT[i];
    const sl = CSINLON[i] * cosY - CCOSLON[i] * sinY;
    const cl = CCOSLON[i] * cosY + CSINLON[i] * sinY;
    const X = cp * sl, Y = sp, Z = cp * cl;
    CX[i] = X; CY[i] = Y * ct - Z * st; CZ[i] = Y * st + Z * ct;
  }
}
function paintChina(gx, cyc, R){
  projectChina();
  // 填一层暖色，把中国从薄荷色的亚洲里拎出来
  ctx.beginPath();
  for (let r = 0; r < C_N; r++){
    const s0 = C_START[r], n = C_LEN[r];
    let m = 0;
    for (let k = 0; k < n; k++){
      const i = s0 + k, j = s0 + ((k + n - 1) % n);
      const zc = CZ[i], zp = CZ[j];
      if (zc >= 0){
        if (zp < 0){
          const t = zp / (zp - zc);
          CXB[m] = CX[j] + (CX[i] - CX[j]) * t; CYB[m] = CY[j] + (CY[i] - CY[j]) * t; HOR[m] = 1; m++;
        }
        CXB[m] = CX[i]; CYB[m] = CY[i]; HOR[m] = 0; m++;
      } else if (zp >= 0){
        const t = zp / (zp - zc);
        CXB[m] = CX[j] + (CX[i] - CX[j]) * t; CYB[m] = CY[j] + (CY[i] - CY[j]) * t; HOR[m] = 1; m++;
      }
    }
    if (m < 3) continue;
    traceClipped(ctx, gx, cyc, R, m);
  }
  ctx.fillStyle = cssVar('--cn-fill');
  ctx.fill();

  // 只描看得见的那半圈边界
  ctx.beginPath();
  for (let r = 0; r < C_N; r++){
    const s0 = C_START[r], n = C_LEN[r];
    let open = false;
    for (let k = 0; k < n; k++){
      const i = s0 + k, j = s0 + ((k + 1) % n);
      if (CZ[i] > 0.02 && CZ[j] > 0.02){
        const ax = gx + R * CX[i], ay = cyc - R * CY[i];
        const bx = gx + R * CX[j], by = cyc - R * CY[j];
        if (!open){ ctx.moveTo(ax, ay); open = true; }
        ctx.lineTo(bx, by);
      } else open = false;
    }
  }
  ctx.strokeStyle = cssVar('--cn-edge');
  ctx.lineWidth = Math.max(0.65, R * 0.0025);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
}

function paintRings(gx, cyc, R, keep, color){
  ctx.beginPath();
  let any = false;
  for (let r = 0; r < RING_N; r++){
    if (!keep(r)) continue;
    if (RING_LON[r] === 0 && false) continue;
    const s0 = RSTART[r], n = RLEN[r];
    let m = 0;
    for (let k = 0; k < n; k++){
      const i = s0 + k, j = s0 + ((k + n - 1) % n);
      const zc = ZS[i], zp = ZS[j];
      if (zc >= 0){
        if (zp < 0){
          const t = zp / (zp - zc);
          CXB[m] = XS[j] + (XS[i] - XS[j]) * t; CYB[m] = YS[j] + (YS[i] - YS[j]) * t; HOR[m] = 1; m++;
        }
        CXB[m] = XS[i]; CYB[m] = YS[i]; HOR[m] = 0; m++;
      } else if (zp >= 0){
        const t = zp / (zp - zc);
        CXB[m] = XS[j] + (XS[i] - XS[j]) * t; CYB[m] = YS[j] + (YS[i] - YS[j]) * t; HOR[m] = 1; m++;
      }
    }
    if (m < 3) continue;
    traceClipped(ctx, gx, cyc, R, m);
    any = true;
  }
  if (!any) return;
  ctx.fillStyle = color;
  ctx.fill();
}

const cssVarCache = {};
function cssVar(name){
  if (!cssVarCache[name]) cssVarCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return cssVarCache[name];
}

function pointInPoly(x, y, pts){
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
/* 点在球面上的中国范围里吗 */
function hitChina(px, py){
  const R = baseR * zoom, gx = cx + viewX, cyc = cy + viewY;
  if (Math.hypot(px - gx, py - cyc) > R) return false;
  projectChina();
  for (let r = 0; r < C_N; r++){
    const s0 = C_START[r], n = C_LEN[r];
    const pts = [];
    for (let k = 0; k < n; k++){
      const i = s0 + k;
      if (CZ[i] > 0.03) pts.push([gx + R * CX[i], cyc - R * CY[i]]);
      else if (pts.length) break;
    }
    if (pts.length >= 3 && pointInPoly(px, py, pts)) return true;
  }
  return false;
}

/* 海、投影、光影在旋转时不变：一次画进离屏画布，每帧只贴图 + 画陆地 */
let noiseCanvas = null;
function noiseTile(){
  if (noiseCanvas) return noiseCanvas;
  const n = document.createElement('canvas');
  n.width = n.height = 140;
  const g = n.getContext('2d');
  const img = g.createImageData(140, 140);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 196 + Math.random() * 59;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  noiseCanvas = n;
  return n;
}

let layerUnder = null, layerOver = null;
function buildLayers(){

  const hi = o.createRadialGradient(cx - R*.4, cy - R*.44, 0, cx - R*.4, cy - R*.44, R*1.15);
  hi.addColorStop(0, 'rgba(255,255,255,.22)'); hi.addColorStop(.5, 'rgba(255,255,255,.04)');
  hi.addColorStop(1, 'rgba(255,255,255,0)');

}

// Separate nearby pins gently, keeping each food near its geographic origin.
function spreadPins(points,distance,bounds){
  const placed=[];
  for(const p of points){
    let chosen=null;
    for(let i=0;i<900;i++){
      const radius=i?distance*.52*Math.sqrt(i):0,angle=i*2.399963229728653;
      const x=Math.max(bounds.left,Math.min(bounds.right,p.x+Math.cos(angle)*radius));
      const y=Math.max(bounds.top,Math.min(bounds.bottom,p.y+Math.sin(angle)*radius));
      if(placed.every(q=>Math.hypot(q.x-x,q.y-y)>=distance)){chosen={...p,originX:p.x,originY:p.y,x,y};break;}
    }
    placed.push(chosen||{...p,originX:p.x,originY:p.y});
  }
  return placed;
}
// All pin labels share intrinsic sizing and choose the roomier side near an edge.
function fitPinLabel(el,x,rightEdge,scale=1){
  const gap=16,edge=12;
  const leftRoom=x-edge,rightRoom=rightEdge-x-edge;
  const preferred=Math.min(210,window.innerWidth*.55);
  const flip=rightRoom<(preferred+gap)*scale&&leftRoom>rightRoom;
  const room=(flip?leftRoom:rightRoom)/scale-gap;
  el.classList.toggle('flip',flip);
  el.style.setProperty('--label-width',Math.max(60,Math.min(preferred,room))+'px');
}
function updateMarkers(R){

const cnView = document.getElementById('cnView');

const cnEls = [];

function albers(lon, lat){
  const RD = Math.PI / 180;
  const p1 = 25 * RD, p2 = 47 * RD, l0 = 105 * RD;
  const n = (Math.sin(p1) + Math.sin(p2)) / 2;
  const C = Math.cos(p1) ** 2 + 2 * n * Math.sin(p1);
  const rho = Math.sqrt(Math.max(0, C - 2 * n * Math.sin(lat * RD))) / n;
  const rho0 = Math.sqrt(C) / n;
  const th = n * (lon * RD - l0);
  return [rho * Math.sin(th), rho0 - rho * Math.cos(th)];
}

function layoutChina(){

const chinaPinProvince=new Map(DATA.china.map(e=>[e.id,PROV.find(r=>pointInPoly(e.lon,e.lat,r))]));
function spreadChinaPins(raw,distance){
  const projected=new Map(),placed=[];
  for(const p of raw){
    const region=chinaPinProvince.get(p.e.id);
    if(!region){placed.push(p);continue;}
    if(!projected.has(region))projected.set(region,region.map(([lon,lat])=>cnProj(albers(lon,lat))));
    const ring=projected.get(region);
    const inside=(x,y)=>pointInPoly(x,y,ring);
    const clearance=(x,y)=>[[3.5,0],[-3.5,0],[0,3.5],[0,-3.5]].every(([dx,dy])=>inside(x+dx,y+dy));
    const candidates=[];let chosen=null;
    // Search nearby land in the original province, never push a point across the sea.
    for(let i=0;i<=420;i++){
      const radius=i?2.5*Math.sqrt(i):0,angle=i*2.399963229728653;
      const x=p.x+Math.cos(angle)*radius,y=p.y+Math.sin(angle)*radius;
      if(!inside(x,y))continue;
      const gap=Math.min(Infinity,...placed.map(q=>Math.hypot(q.x-x,q.y-y)));
      const safe=clearance(x,y),candidate={x,y,gap,safe};
      candidates.push(candidate);
      if(safe&&gap>=distance){chosen=candidate;break;}
    }
    if(!chosen){
      const safe=candidates.filter(c=>c.safe),pool=safe.length?safe:candidates;
      for(const gap of [22,16,10,6]){chosen=pool.find(c=>c.gap>=gap);if(chosen)break;}
      chosen ||= pool.reduce((best,c)=>!best||c.gap>best.gap?c:best,null);
    }
    placed.push({...p,x:chosen?.x??p.x,y:chosen?.y??p.y});
  }
  return placed;
}

function chooseChinaPeekPosition(anchor,width,height,bounds,previewHeight=height,points=[]){
  const gap=64;
  const clampX=x=>Math.max(bounds.left,Math.min(bounds.right-width,x));
  const clampY=y=>Math.max(bounds.top,Math.min(bounds.bottom-height,y));
  const candidates=[];
  const add=(x,y)=>candidates.push({x:clampX(x),y:clampY(y)});
  for(const distance of [gap,112,176])for(const dy of [0,-80,80,-160,160]){
    add(anchor.x-distance-width,anchor.y-previewHeight/2+dy);
    add(anchor.x+distance,anchor.y-previewHeight/2+dy);
  }
  add(anchor.x-width/2,anchor.y-gap-height);add(anchor.x-width/2,anchor.y+gap);
  // Empty-space fallbacks are rescored per anchor, never retained as a fixed dock.
  for(let x=bounds.left;x<=bounds.right-width;x+=32)for(let y=bounds.top;y<=bounds.bottom-height;y+=32)add(x,y);
  add(bounds.right-width,bounds.bottom-height);
  const covers=(c,p,pad)=>p.x+pad>c.x&&p.x-pad<c.x+width&&p.y+pad>c.y&&p.y-pad<c.y+height;
  const preferLeft=anchor.x<(bounds.left+bounds.right)/2;
  let best=null;
  for(const c of candidates){
    const dx=Math.max(c.x-anchor.x,0,anchor.x-c.x-width),dy=Math.max(c.y-anchor.y,0,anchor.y-c.y-previewHeight);
    const distance=Math.hypot(dx,dy);
    const blocked=points.filter(p=>covers(c,p,22)).length;
    const nearBlocked=points.filter(p=>Math.hypot(p.x-anchor.x,p.y-anchor.y)<100&&covers(c,p,22)).length;
    const score=(covers(c,anchor,24)?1e8:0)+blocked*1e6+nearBlocked*1e5+
      Math.max(0,gap-distance)*1000+Math.abs(distance-gap)*2+
      Math.abs(c.y+previewHeight/2-anchor.y)*.5+((c.x+width/2<anchor.x)!==preferLeft?15:0);
    if(!best||score<best.score)best={...c,score};
  }
  return {x:best.x,y:best.y};
}
function peekConnectorPath(id,sx,sy,ex,ey,width,height){
  // Stable per-food variation: direction, bend strength, and where the curve opens.
  let seed=2166136261;
  for(const char of id)seed=Math.imul(seed^char.charCodeAt(0),16777619)>>>0;
  const sample=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
  const direction=sample()<.5?-1:1;
  const dx=ex-sx,dy=ey-sy,span=Math.max(1,Math.hypot(dx,dy));
  const bend=Math.min(30+sample()*38,span*(.14+sample()*.27));
  const first=.22+sample()*.17,second=.63+sample()*.17;
  const counterCurve=sample()<.28;
  const bend2=bend*(.45+sample()*.7)*(counterCurve?-1:1);
  const control=(along,offset)=>({
    x:Math.max(12,Math.min(width-12,sx+dx*along-dy/span*offset*direction)),
    y:Math.max(12,Math.min(height-12,sy+dy*along+dx/span*offset*direction))
  });
  const a=control(first,bend),b=control(second,bend2);
  return `M ${sx} ${sy} C ${a.x} ${a.y} ${b.x} ${b.y} ${ex} ${ey}`;
}
function updatePeekConnector(){

  const ends=[
    {x:card.left,y:Math.max(card.top+16,Math.min(card.bottom-16,ay))},
    {x:card.right,y:Math.max(card.top+16,Math.min(card.bottom-16,ay))},
    {x:Math.max(card.left+16,Math.min(card.right-16,ax)),y:card.top},
    {x:Math.max(card.left+16,Math.min(card.right-16,ax)),y:card.bottom}

  const end=ends.sort((a,b)=>Math.hypot(a.x-ax,a.y-ay)-Math.hypot(b.x-ax,b.y-ay))[0];

  scheduleIdle();
}
function scheduleHidePeek(event){
  if(event?.pointerType==='touch'||peekInput==='touch')return;
  clearTimeout(peekTimer);peekTimer=setTimeout(()=>{
    const focused=keyboardMode&&(peek.contains(document.activeElement)||document.activeElement===peekAnchor);
    if(!peek.matches(':hover')&&!peekAnchor?.matches(':hover')&&!focused)hidePeek();
  },90);
}
function cancelHoverSwitch(){clearTimeout(hoverSwitchTimer);hoverSwitchTimer=0;pendingHover=null;}
function enterFoodHover(el,entry,event){
  if(detailEntry)return;
  lastPointerType=event.pointerType||'mouse';if(lastPointerType==='touch')return;
  keyboardMode=false;
  // While travelling from the directory, passing over a map pin must not hijack the card.
  const travellingToCard=peekAnchor&&lastHoverPoint&&Number.isFinite(event.clientX)&&towardCard({x:event.clientX,y:event.clientY},lastHoverPoint,peekAnchor.getBoundingClientRect(),peek.getBoundingClientRect());
  if((peekAnchor?.hasAttribute('data-food')||travellingToCard)&&el.classList.contains('cpin')&&peek.classList.contains('show')){
    cancelHoverSwitch();clearTimeout(peekTimer);pendingHover={el,entry};
    hoverSwitchTimer=setTimeout(()=>{const next=pendingHover;pendingHover=null;hoverSwitchTimer=0;if(next)peekShow([next.entry],next.el);},220);
    return;
  }
  peekShow([entry],el);
}
function closePeek(){
  const anchor=peekAnchor,restore=peek.contains(document.activeElement);hidePeek();
  if(restore&&anchor?.isConnected){const wasKeyboard=keyboardMode;keyboardMode=false;anchor.focus();keyboardMode=wasKeyboard;}
}
function peekShow(entries,el){
  if(detailEntry)return;
  cancelHoverSwitch();clearTimeout(peekTimer);peekInput=keyboardMode?'keyboard':lastPointerType;
  if(el.classList.contains('china'))return;
  if(peekAnchor===el&&peek.classList.contains('show'))return;
  const e=entries[0];if(!e)return;
  peekAnchor?.setAttribute('aria-expanded','false');peekAnchor=el;peekExpanded=false;
  el.setAttribute('aria-expanded','true');el.setAttribute('aria-controls','peek');
  focus=null;vYaw=vPitch=0;clearTimeout(idleTimer);peek.classList.remove('expanded');peek.style.removeProperty('--peek-limit');
  peek.innerHTML=`<div class="peek-head"><h2 class="peek-title">${esc(e.name)}</h2></div><div class="peek-scroll">${peekEntry(e)}</div><footer class="peek-footer"><button type="button" class="peek-more" id="peekMore" aria-controls="foodDetail"><span>Click the star to see more</span></button></footer>`;
  $('peekMore').addEventListener('click',()=>openFoodDetail(e));
  cnEls.forEach(pin=>pin.classList.toggle('active',pin.dataset.key===e.id));
  directory.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.food===e.id));
  placePeek(el);
  $('peekExpand').addEventListener('click',()=>{
    peekExpanded=!peekExpanded;peek.classList.toggle('expanded',peekExpanded);$('foodDetails').hidden=!peekExpanded;
    $('peekExpand').setAttribute('aria-expanded',String(peekExpanded));$('peekExpand').textContent=peekExpanded?'Hide facts':'Quick facts';
    updatePeekConnector();
  });
}
peek.addEventListener('pointerenter',event=>{if(event.pointerType&&event.pointerType!=='touch'){lastPointerType=event.pointerType;peekInput=event.pointerType;}cancelHoverSwitch();clearTimeout(peekTimer);});peek.addEventListener('pointerleave',scheduleHidePeek);
peek.addEventListener('focusin',()=>clearTimeout(peekTimer));peek.addEventListener('focusout',scheduleHidePeek);
function setSurfaceAvailability(){const reading=!!detailEntry&&isPhoneLayout();document.querySelector('.globe-wrap').inert=cnOpen||reading;cnView.inert=!cnOpen||reading;}
function markActive(c){activePin=c;for(const k in markers)markers[k].el.classList.toggle('active',!!c&&markers[k].c.key===c.key);}
// Only protect a deliberate, short journey toward the card, never unrelated mouse movement.
function towardCard(point,previous,anchor,card){
  if(!previous)return false;
  const tx=Math.max(card.left,Math.min(card.right,point.x)),ty=Math.max(card.top,Math.min(card.bottom,point.y));
  const moving=(point.x-previous.x)*(tx-point.x)+(point.y-previous.y)*(ty-point.y)>0;
  const minX=Math.min(anchor.left,card.left)-6,maxX=Math.max(anchor.right,card.right)+6;
  const minY=Math.min(anchor.top,card.top)-6,maxY=Math.max(anchor.bottom,card.bottom)+6;
  return moving&&point.x>=minX&&point.x<=maxX&&point.y>=minY&&point.y<=maxY;
}
document.addEventListener('pointermove',event=>{
  if(event.pointerType==='touch')return;
  keyboardMode=false;lastPointerType=event.pointerType||'mouse';peekInput=lastPointerType;const point={x:event.clientX,y:event.clientY},previous=lastHoverPoint;lastHoverPoint=point;
  if(!peekAnchor||!peek.classList.contains('show'))return;
  if(peek.contains(event.target)||peekAnchor.contains(event.target)){cancelHoverSwitch();clearTimeout(peekTimer);return;}
  if(pendingHover?.el.contains(event.target)){clearTimeout(peekTimer);return;}
  if(towardCard(point,previous,peekAnchor.getBoundingClientRect(),peek.getBoundingClientRect())){scheduleHidePeek();return;}
  hidePeek();
});
document.addEventListener('pointerdown',event=>{keyboardMode=false;lastPointerType=event.pointerType||'mouse';if(peek.contains(event.target)||peekAnchor?.contains(event.target)){peekInput=lastPointerType;clearTimeout(peekTimer);}else hidePeek();},true);
window.addEventListener('keydown',event=>{
  keyboardMode=true;peekInput='keyboard';
  if(event.key==='Tab'&&!event.shiftKey&&document.activeElement===peekAnchor&&peek.classList.contains('show')){event.preventDefault();$('peekExpand')?.focus();return;}
  if(event.key!=='Escape')return;
  if(detailEntry){event.preventDefault();closeFoodDetail(true);return;}
  if(peek.classList.contains('show')){event.preventDefault();closePeek();}
  else if(directoryOpen){event.preventDefault();setDirectoryOpen(false);$('cnList').focus();}
  else if(cnOpen)closeChina();
});

/* ---------- 点击详情：独立阅读区，不随悬停离开关闭 ---------- */
function openFoodDetail(entry){
  if(!entry)return;detailEntry=entry;hidePeek();focus=null;vYaw=vPitch=0;
  const pane=$('foodDetail');
  const entries=cnOpen?DATA.china:DATA.world,index=entries.findIndex(e=>e.id===entry.id);
  const backIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>';
  pane.innerHTML=`<div class="detail-toolbar"><button type="button" id="detailBack">${backIcon}Back to map</button><span>${cnOpen?'China':'World'} · ${index+1} / ${entries.length}</span></div><div class="detail-content"><h2 id="detailTitle">${esc(entry.name)}</h2><p class="detail-place">${esc(entry.place)}</p>${photoBlock(entry,'food-photo')}<p class="detail-intro">${esc(entry.taste)}</p>${entry.local?`<p class="food-local">${esc(entry.local)}</p>`:''}${entry.categoryLabel?`<span class="category-label">${esc(entry.categoryLabel)}</span>`:''}<dl class="food-facts">${[['Ingredients',entry.materials],['Preparation',entry.process],['Enjoy it',entry.eat]].map(([label,value])=>`<div class="food-fact"><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl><footer class="food-sources"><p>${creditBlock(entry)}</p>${entry.sourceUrl?`<p>Reference: <a href="${esc(safeUrl(entry.sourceUrl))}" target="_blank" rel="noopener">${esc(entry.sourceTitle||'View reference')}</a></p>`:''}</footer>${nearbyWorldNav(entry)}</div>`;
  pane.insertAdjacentHTML('beforeend',`<nav class="detail-pagination" aria-label="Browse flavors"><button type="button" id="detailPrevious" ${index===0?'disabled':''}>Previous flavor</button><button type="button" id="detailNext" ${index===entries.length-1?'disabled':''}>Next flavor</button></nav>`);
  $('detailBack').addEventListener('click',()=>closeFoodDetail(true));
  $('detailPrevious').addEventListener('click',()=>{if(index>0)openFoodDetail(entries[index-1]);});
  $('detailNext').addEventListener('click',()=>{if(index<entries.length-1)openFoodDetail(entries[index+1]);});
  pane.hidden=false;pane.scrollTop=0;document.body.classList.add('detail-open');
  resize();if(cnOpen)layoutChina();else requestRender();
  if(keyboardMode||isPhoneLayout())pane.focus({preventScroll:true});
}
function closeFoodDetail(restore=false){
  if(!detailEntry)return;
  const previous=detailEntry;detailEntry=null;$('foodDetail').hidden=true;document.body.classList.remove('detail-open');
  resize();if(cnOpen)layoutChina();else requestRender();
  if(restore){const target=cnOpen?cnEls.find(el=>el.dataset.key===previous.id):markers[previous.id]?.el;const mode=keyboardMode;keyboardMode=false;target?.focus();keyboardMode=mode;}
}
document.addEventListener('click',event=>{
  if(!detailEntry||$('foodDetail').contains(event.target)||event.target.closest('button,a,input,select,textarea'))return;
  if(event.target===canvas&&movedDuringDrag)return;
  event.preventDefault();event.stopPropagation();setDirectoryOpen(false);closeFoodDetail();
},true);

/* ---------- Pointer, keyboard and zoom ---------- */
let activePointer = null, downX = 0, downY = 0, movedDuringDrag = false;
function beginInteraction(){clearTimeout(idleTimer);focus=null;vYaw=vPitch=0;lastMove=performance.now();hidePeek(true);}
canvas.addEventListener('pointerdown',event=>{
  if(activePointer!==null||!event.isPrimary||(event.pointerType==='mouse'&&event.button!==0))return;
  beginInteraction();activePointer=event.pointerId;dragging=true;movedDuringDrag=false;
  lastX=downX=event.clientX;lastY=downY=event.clientY;canvas.classList.add('dragging');canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(!dragging||event.pointerId!==activePointer)return;
  const dx=event.clientX-lastX,dy=event.clientY-lastY,k=.32/zoom;
  lastX=event.clientX;lastY=event.clientY;
  if(Math.hypot(lastX-downX,lastY-downY)>8)movedDuringDrag=true;
  yaw-=dx*k;pitch=Math.max(-70,Math.min(70,pitch+dy*k));vYaw=motionPreference.matches?0:-dx*k*.9;vPitch=motionPreference.matches?0:dy*k*.9;
  lastMove=performance.now();requestRender();
});
function endDrag(event){
  if(!dragging||(event?.pointerId!=null&&event.pointerId!==activePointer))return;
  const id=activePointer;activePointer=null;dragging=false;canvas.classList.remove('dragging');lastMove=performance.now();
  try{if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);}catch{}
  requestRender();scheduleIdle();
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',event=>{vYaw=vPitch=0;endDrag(event);});
canvas.addEventListener('lostpointercapture',event=>{if(event.pointerId===activePointer){vYaw=vPitch=0;endDrag(event);}});
window.addEventListener('blur',()=>{vYaw=vPitch=0;endDrag();hidePeek();});
function setZoom(value){hidePeek();zoom=Math.max(.82,Math.min(1.28,value));resize();focus=null;lastMove=performance.now();requestRender();scheduleIdle();}
canvas.addEventListener('wheel',event=>{event.preventDefault();setZoom(zoom*(1-event.deltaY*.0012));},{passive:false});
canvas.addEventListener('click',event=>{
  if(movedDuringDrag||Math.hypot(event.clientX-downX,event.clientY-downY)>8)return;
  const rect=canvas.getBoundingClientRect();if(hitChina(event.clientX-rect.left,event.clientY-rect.top))openChina();
});
canvas.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home','Enter'].includes(event.key))return;
  event.preventDefault();beginInteraction();
  if(event.key==='Enter'){openChina();return;}
  if(event.key==='Home'){returnToChina();return;}
  if(['+','=','-'].includes(event.key)){setZoom(zoom+(event.key==='-'?-.1:.1));return;}
  if(event.key==='ArrowLeft')yaw-=8;if(event.key==='ArrowRight')yaw+=8;
  if(event.key==='ArrowUp')pitch=Math.min(70,pitch+8);if(event.key==='ArrowDown')pitch=Math.max(-70,pitch-8);
  requestRender();scheduleIdle();
});
cnView.addEventListener('click',event=>{if(event.target===cnView||event.target===cnCanvas){hidePeek(true);cnEls.forEach(el=>el.classList.remove('active'));}});
/* ---------- Demand-driven drawing ---------- */
let prev=performance.now(),costAvg=0,lastTierChange=0,fastFrames=0,slowFrames=0;
function requestRender(){if(!rafId&&!document.hidden&&!cnOpen)rafId=requestAnimationFrame(frame);}
function idleAllowed(){return motionEnabled&&!motionPreference.matches&&!cnOpen&&!document.hidden&&!activePin&&!hoverPin&&!peek.classList.contains('show')&&!detailEntry&&!dragging;}
function scheduleIdle(){clearTimeout(idleTimer);if(idleAllowed())idleTimer=setTimeout(requestRender,1450);}
function frame(now){
  rafId=0;if(document.hidden||cnOpen)return;
  const dt=Math.min(50,Math.max(1,now-prev));prev=now;let animating=false;
  if(focus){
    focus.t=Math.min(1,focus.t+dt/720);const e=1-Math.pow(1-focus.t,3);
    yaw=focus.y0+(focus.y1-focus.y0)*e;pitch=focus.p0+(focus.p1-focus.p0)*e;
    if(focus.t>=1)focus=null;else animating=true;
  }else if(!dragging){
    if(hoverPin){vYaw=vPitch=0;}
    else if(Math.abs(vYaw)>.0015||Math.abs(vPitch)>.0015){
      const factor=dt/16.7;yaw+=vYaw*factor;pitch=Math.max(-70,Math.min(70,pitch+vPitch*factor));
      vYaw*=Math.pow(.94,factor);vPitch*=Math.pow(.94,factor);animating=true;
    }else if(idleAllowed()&&now-lastMove>1400){yaw+=dt*.0024;animating=true;}
  }
  const oldX=viewX,oldY=viewY;updateCenter();
  if(Math.abs(viewX-oldX)>.02||Math.abs(viewY-oldY)>.02)animating=true;
  const started=performance.now();drawGlobe();updateMarkers(baseR*zoom);
  const cost=performance.now()-started;costAvg=costAvg?costAvg*.9+cost*.1:cost;
  slowFrames=costAvg>20?slowFrames+1:0;fastFrames=costAvg<8?fastFrames+1:0;
  if(now-lastTierChange>5000&&((slowFrames>=25&&qualityTier<QUALITY.length-1)||(fastFrames>=150&&qualityTier>0))){
    qualityTier+=slowFrames>=25?1:-1;lastTierChange=now;slowFrames=fastFrames=0;resize();animating=true;
  }
  if(animating)requestRender();
}
function angleDelta(from,to){return ((to-from+180)%360+360)%360-180;}
function offChina(){return Math.abs(angleDelta(yaw,CN_VIEW.yaw));}
function returnToChina(){
  hidePeek(true);markActive(null);zoom=CN_VIEW.zoom;resize();vYaw=vPitch=0;
  const target=yaw+angleDelta(yaw,CN_VIEW.yaw);
  if(motionPreference.matches){yaw=target;pitch=CN_VIEW.pitch;focus=null;}
  else focus={y0:yaw,y1:target,p0:pitch,p1:CN_VIEW.pitch,t:0};
  requestRender();scheduleIdle();
}
motionPreference.addEventListener('change',()=>{motionEnabled=!motionPreference.matches;vYaw=vPitch=0;if(motionPreference.matches&&focus){yaw=focus.y1;pitch=focus.p1;focus=null;}requestRender();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(rafId);rafId=0;clearTimeout(idleTimer);vYaw=vPitch=0;}else{prev=performance.now();requestRender();scheduleIdle();}});
resize();setSurfaceAvailability();requestRender();scheduleIdle();
// Reflow after font substitution or text wrapping changes, as well as viewport resize.
if(typeof ResizeObserver!=='undefined'){
  const headerObserver=new ResizeObserver(refreshLayout);
  headerObserver.observe(document.querySelector('header'));
  const peekObserver=new ResizeObserver(updatePeekConnector);peekObserver.observe(peek);
}
document.fonts?.ready.then(refreshLayout);

</script>
